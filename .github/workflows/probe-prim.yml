# Sonde manuelle des API PRIM (Ile-de-France Mobilites). N'affiche que des compteurs.
name: probe-prim
on:
  workflow_dispatch:
    inputs:
      script:
        default: probe_prim.py
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python recorder/${{ inputs.script }}
        env:
          PRIM_API_KEY: ${{ secrets.PRIM_API_KEY }}
