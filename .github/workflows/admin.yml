# Tableau de bord : applique les fonctions SQL de gestion, recopie le mot de passe ADMIN_TOKEN dans les secrets
# de la fonction serveur « admin », puis la déploie. Secrets : DATABASE_URL, SUPABASE_URL, SUPABASE_ACCESS_TOKEN, ADMIN_TOKEN.
name: admin
on:
  push:
    branches: [main]
    paths: ["supabase/functions/admin/**", "recorder/schema_admin.sql", ".github/workflows/admin.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Fonctions SQL du tableau de bord
        run: python -c "import sys, psycopg; sys.path.insert(0, 'recorder'); from sncf_common import apply_schema; c = psycopg.connect(__import__('os').environ['DATABASE_URL']); apply_schema(c); c.close(); print('schéma appliqué')"
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Mot de passe du tableau de bord (jamais affiché)
        run: |
          if [ ${#ADMIN_TOKEN} -lt 16 ]; then echo "::warning::Secret ADMIN_TOKEN absent ou trop court (16 caractères minimum) : le tableau de bord restera fermé"; exit 0; fi
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)[.]supabase[.]co.*#\1#p')
          printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN" > /tmp/a.env
          supabase secrets set --project-ref "$REF" --env-file /tmp/a.env --yes
          rm -f /tmp/a.env
      - name: Déployer la fonction admin
        run: |
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)[.]supabase[.]co.*#\1#p')
          supabase functions deploy admin --project-ref "$REF" --no-verify-jwt --use-api --yes
