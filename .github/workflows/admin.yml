# Tableau de bord : applique les fonctions SQL de gestion, recopie le mot de passe ADMIN_TOKEN dans les secrets
# de la fonction serveur « admin », puis la déploie. Secrets : DATABASE_URL, SUPABASE_URL, SUPABASE_ACCESS_TOKEN, ADMIN_TOKEN.
name: admin
on:
  push:
    branches: [main]
    paths: ["supabase/functions/admin/**", "recorder/schema_admin.sql", "recorder/schema_social.sql", ".github/workflows/admin.yml"]
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      ADMIN_TOKEN: ${{ secrets.ADMIN_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - name: Fonctions SQL du tableau de bord
        run: python -c "import sys, psycopg; sys.path.insert(0, 'recorder'); from sncf_common import apply_schema; c = psycopg.connect(__import__('os').environ['DATABASE_URL']); apply_schema(c); n = len(c.execute('SELECT admin_stats()::text').fetchone()[0]); r = len(c.execute('SELECT admin_reviews()::text').fetchone()[0]); c.close(); print(f'schéma appliqué, statistiques OK ({n} caractères), avis OK ({r})')"
      - name: Démo, classement et prévision (données agrégées publiques)
        run: |
          python - <<'EOF'
          import os, time, json, psycopg
          c = psycopg.connect(os.environ["DATABASE_URL"])
          for q in ["SELECT public_data_span()::text", "SELECT public_worst_lines(7)::text", "SELECT public_demo_trips()::text"]:
              t = time.time(); r = c.execute(q).fetchone()[0]; print(f"{q} ({time.time()-t:.2f} s) : {r[:700]}")
          w = json.loads(c.execute("SELECT public_worst_lines(7)::text").fetchone()[0])
          ids = [x["id"] for x in w["worst"] if x["net"] == "sncf"][:2]
          t = time.time(); r = c.execute("SELECT public_line_risk('sncf', %s)::text", (ids,)).fetchone()[0]; print(f"risk ({time.time()-t:.2f} s) : {r[:700]}")
          t = time.time(); rows = c.execute("SELECT x.day, l.short_name, x.mode, x.n, x.late5, x.late15, x.cancelled, round(x.sum_delay / 60.0 / NULLIF(x.n, 0), 1) FROM lp_metro_days(to_char(now() - interval '3 days', 'YYYYMMDD')) x JOIN idfm_ref_lines l USING (line_id) ORDER BY x.late15::numeric / NULLIF(x.n, 0) DESC NULLS LAST, x.late5 DESC LIMIT 12").fetchall()
          print(f"métro ({time.time()-t:.2f} s) : jour, ligne, mode, rames prévues, +5, +15, supprimées, retard moyen (min)")
          for r in rows: print("  ", r)
          w = json.loads(c.execute("SELECT public_worst_lines(7)::text").fetchone()[0])
          print("classement :", [(x["name"], x["mode"], x["pct15"]) for x in w["worst"]][:15])
          c.close()
          EOF
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Mot de passe du tableau de bord (jamais affiché)
        run: |
          if [ ${#ADMIN_TOKEN} -lt 16 ]; then echo "::warning::Secret ADMIN_TOKEN absent ou trop court (16 caractères minimum) : le tableau de bord restera fermé"; exit 0; fi
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)[.]supabase[.]co.*#\1#p')
          printf 'ADMIN_TOKEN=%s\n' "$ADMIN_TOKEN" > /tmp/a.env
          supabase secrets set --project-ref "$REF" --env-file /tmp/a.env --yes
          rm -f /tmp/a.env
      - name: Déployer la fonction admin
        run: |
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)[.]supabase[.]co.*#\1#p')
          supabase functions deploy admin --project-ref "$REF" --no-verify-jwt --use-api --yes
