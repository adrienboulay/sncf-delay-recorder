# Rapport manuel : nombre de lignes par table (aucune donnee detaillee, les logs sont publics).
name: report
on:
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python recorder/check_dburl.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python recorder/report.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python recorder/db_health.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
