# Recharge chaque nuit les referentiels SNCF (lignes, gares, trains prevus, calendrier) et Ile-de-France (lignes, arrets).
name: load-sncf-reference

on:
  schedule:
    - cron: "15 3 * * *"
  workflow_dispatch: {}

jobs:
  load:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python recorder/load_reference.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - run: python recorder/load_reference_idfm.py
        if: always()
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
