# Previsions de greves (agenda public), toutes les 6 h. Le cache Firecrawl limite a ~2 credits par jour.
name: strike-watch
on:
  schedule:
    - cron: "20 */6 * * *"
  workflow_dispatch: {}
permissions:
  contents: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q "psycopg[binary]"
      - run: python recorder/strike_watch.py
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
          FIRECRAWL_DAILY_CAP: "10"
