# Copilote : teste la fonction serveur « assistant », puis la deploie sur Supabase (Edge Functions).
# Secrets : SUPABASE_URL (deja la), SUPABASE_ACCESS_TOKEN (jeton personnel Supabase, pour deployer),
# GROQ_API_KEY (gratuit, prioritaire) ou MISTRAL_API_KEY (offre « Experiment »), ELEVENLABS_API_KEY (voix, optionnel).
# Sans SUPABASE_ACCESS_TOKEN ni aucune cle : tests seulement.
name: assistant
on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/assistant.yml"]
  workflow_dispatch:
    inputs:
      question:
        description: "Question de test envoyee apres le deploiement (vide = aucune)"
        default: "Y a-t-il des greves ou des travaux sur le RER B ?"
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno check supabase/functions/assistant/index.ts
      - run: deno test supabase/functions/assistant/
      - name: Outils sur les vraies donnees (lecture seule)
        if: env.SUPABASE_URL != ''
        run: deno run --allow-net --allow-env supabase/functions/assistant/live_check.ts
      - name: Cle Gemini et modele (la cle n'est jamais affichee)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: deno run --allow-net --allow-env supabase/functions/assistant/probe_llm.ts

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets presents ?
        id: ok
        run: |
          REF=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^https://([a-z0-9]+)\.supabase\.co.*#\1#p')
          if [ -z "$REF" ] || [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::warning::SUPABASE_ACCESS_TOKEN manquant : deploiement saute (tests seulement)"
            echo "go=0" >> "$GITHUB_OUTPUT"
          elif [ -z "$GROQ_API_KEY" ] && [ -z "$MISTRAL_API_KEY" ] && [ -z "$ELEVENLABS_API_KEY" ]; then
            echo "::warning::Aucune cle (GROQ_API_KEY, MISTRAL_API_KEY ou ELEVENLABS_API_KEY) : deploiement saute (tests seulement)"
            echo "go=0" >> "$GITHUB_OUTPUT"
          else
            echo "go=1" >> "$GITHUB_OUTPUT"; echo "ref=$REF" >> "$GITHUB_OUTPUT"
          fi
      - uses: supabase/setup-cli@v1
        if: steps.ok.outputs.go == '1'
        with:
          version: latest
      - name: Cles Groq, Mistral et ElevenLabs -> secrets de la fonction (jamais affichees)
        if: steps.ok.outputs.go == '1'
        run: |
          : > /tmp/fn.env
          [ -n "$MISTRAL_API_KEY" ] && printf 'MISTRAL_API_KEY=%s\n' "$MISTRAL_API_KEY" >> /tmp/fn.env
          [ -n "$GROQ_API_KEY" ] && printf 'GROQ_API_KEY=%s\n' "$GROQ_API_KEY" >> /tmp/fn.env
          [ -n "$ELEVENLABS_API_KEY" ] && printf 'ELEVENLABS_API_KEY=%s\n' "$ELEVENLABS_API_KEY" >> /tmp/fn.env
          supabase secrets set --project-ref "${{ steps.ok.outputs.ref }}" --env-file /tmp/fn.env
          rm -f /tmp/fn.env
      - name: Deployer la fonction
        if: steps.ok.outputs.go == '1'
        run: supabase functions deploy assistant --project-ref "${{ steps.ok.outputs.ref }}" --no-verify-jwt --use-api
      - name: Question de test
        if: steps.ok.outputs.go == '1' && github.event_name == 'workflow_dispatch' && inputs.question != ''
        env:
          QUESTION: ${{ inputs.question }}
        run: |
          sleep 5
          BODY=$(python3 -c 'import json,os;print(json.dumps({"messages":[{"role":"user","content":os.environ["QUESTION"]}]}))')
          BASE=$(printf '%s' "$SUPABASE_URL" | sed -nE 's#^(https://[a-z0-9-]+[.]supabase[.]co).*#\1#p')
          curl -sS -m 60 -X POST "$BASE/functions/v1/assistant" -H "Content-Type: application/json" \
            -H "Origin: https://adrienboulay.github.io" -d "$BODY" -w '\nHTTP %{http_code}\n'
