<style>
:root{--bg:#121417;--surface:#1A1D21;--surface2:#22262B;--surface3:#2B3036;--fg:#E6E6E0;--muted:#9DA2AA;--line:#2B3036;--lime:#FFBE98;--orange:#FF8A5C;--blue:#FFBE98;--on-blue:#121417;--amber:#FF8A5C;--amber-bg:#2A1C15;--mint:#3DD68C;--red:#FF8A5C;--gold:#FFBE98;--dot-ok:#3DD68C;--dot-mid:#FFB547;--dot-bad:#FF8A5C;--soft:#22262B;--ok:#3DD68C;--bad:#FF8A5C;--warn:#FF8A5C;--okfg:#3DD68C;--display:"Manrope","Segoe UI",system-ui,sans-serif;--head:"Bricolage Grotesque","Manrope",sans-serif;--mono:"Manrope","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--display);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--fg);text-decoration:none}
.brand b{color:var(--blue)}
.nav{display:flex;gap:14px}.nav a{color:var(--muted);font-weight:600;text-decoration:none}.nav a:hover{color:var(--blue)}
h1{font-size:clamp(1.5rem,5vw,1.9rem);letter-spacing:-.02em;margin:6px 0 4px;line-height:1.15}
h2{font-size:1.05rem;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card p{margin:0}
.stack>*{min-width:0}
.card.hero{background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.kicker{font:700 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font:700 .92rem var(--display);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.big{width:100%;min-height:56px;font-size:1.05rem;border-radius:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);min-height:36px;padding:6px 8px;justify-self:start}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;border-radius:12px;padding:11px 13px;cursor:pointer;text-decoration:none}
.item:hover{border-color:var(--blue)}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{grid-column:1;font-size:.82rem;color:var(--muted)}
.item .r{grid-row:1/3;grid-column:2;text-align:right}
.d{display:inline-block;font:700 .74rem var(--mono);padding:2px 6px;border-radius:5px;white-space:nowrap}
.d-ok{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
.d-mid{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.d-bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.big-num{display:flex;align-items:baseline;gap:10px}
.big-num b{font:700 2.6rem var(--mono);letter-spacing:-.02em;color:var(--red)}
.big-num b.ok{color:var(--mint)}
.field{display:grid;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
.field input,.field select{font:500 1rem var(--display);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.combo{position:relative}
.sugg{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgb(0 0 0/.16);max-height:300px;overflow:auto;padding:4px;margin:0;list-style:none}
.sugg li{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.sugg li:hover,.sugg li[aria-selected="true"]{background:var(--bg)}
.sugg .x{color:var(--muted);font-size:.8rem}
.steps{display:flex;gap:6px;font:700 .72rem var(--mono);color:var(--muted)}
.steps span{flex:1;border-top:3px solid var(--line);padding-top:6px}
.steps span.on{border-color:var(--blue);color:var(--fg)}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:52px 14px 1fr auto;gap:0 8px;font-size:.9rem;align-items:start}
.tl .tm{font:600 .82rem var(--mono);text-align:right;padding-top:2px}
.tl .rail{position:relative;align-self:stretch}
.tl .rail::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:3px;background:var(--line)}
.tl .rail::after{content:"";position:absolute;left:1px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--muted);box-sizing:border-box}
.tl li.me .rail::after{border-color:var(--blue);background:var(--blue)}
.tl li.skip .nm{text-decoration:line-through;color:var(--muted)}
.tl .nm{padding:0 0 10px;min-width:0;overflow-wrap:anywhere}
.tl li button{border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer}
.tl li button:hover .nm,.tl li.dest .nm{color:var(--blue);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .lbl{min-width:0}.toggle .lbl small{display:block;color:var(--muted);font-size:.8rem}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--blue)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.level{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.level i{width:12px;height:12px;border-radius:50%;display:inline-block}
.lv-bronze i{background:#b06b2a}.lv-argent i{background:#9aa6b8}.lv-or i{background:#d4a514}
.notice{background:var(--amber-bg);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:.88rem}
.msg{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9em;overflow:auto}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{display:flex;width:100%;max-width:600px}
.tabs a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 4px 9px;color:var(--muted);text-decoration:none;font:600 .72rem var(--display)}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:100;max-width:calc(100% - 32px);text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ---- Direction artistique D : lime dominant, nuit, Unbounded + Manrope ---- */
h1,h2,h3{font-family:var(--head);letter-spacing:-.03em}
.wm{font:800 1.12rem var(--head);letter-spacing:-.045em;color:var(--fg)}
.brand{gap:9px}
body{font-variant-numeric:tabular-nums}
.btn,.btn.big{border-radius:999px}
.card{border-radius:22px}
.item{border-radius:18px}
.big-num b{font-family:var(--head);letter-spacing:-.05em}
.big-num b.ok{color:var(--lime)}
.d-ok{background:var(--lime);color:#0B0C0F}.d-mid,.d-bad{background:var(--orange);color:#0B0C0F}
.card.hero{background:var(--surface);border-color:var(--surface)}
.kicker{font-family:var(--display);font-weight:800}
.tabs{background:var(--bg);border-top:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs nav{background:var(--surface);border-radius:30px;padding:6px;gap:4px}
.tabs a{border-radius:24px;padding:8px 4px}
.tabs a[aria-current="page"]{background:var(--lime);color:#0B0C0F}
.tabs a svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.switch input:checked+span::after{background:#0B0C0F}
.steps span.on{border-color:var(--lime)}

/* ---- Revision E : calme et relief. Gros titres gras et aplats lime seulement par touches. ---- */
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.015em}
.wm{font:700 1.15rem var(--head);letter-spacing:-.02em;color:var(--fg)}
.d-ok{background:rgb(255 190 152/.12);color:var(--lime)}.d-mid,.d-bad{background:rgb(255 138 92/.14);color:var(--orange)}
.card{border-color:transparent;box-shadow:inset 0 1px 0 rgb(255 255 255/.06)}
.card.hero{background:var(--surface2);box-shadow:inset 0 1px 0 rgb(255 255 255/.08),0 10px 24px rgb(0 0 0/.35)}
.item{border-color:transparent;background:var(--surface);box-shadow:inset 0 1px 0 rgb(255 255 255/.05)}.item:hover{background:var(--surface2);border-color:transparent}
.big-num b{font-family:var(--head);font-weight:700;letter-spacing:-.03em}
.btn{background:var(--surface2);border-color:transparent;box-shadow:inset 0 1px 0 rgb(255 255 255/.06)}
.btn.primary{background:var(--lime);color:#121417;box-shadow:none}
.btn.ghost{background:none;box-shadow:none}
.btn.danger{color:var(--orange)}
.tabs nav{box-shadow:inset 0 1px 0 rgb(255 255 255/.06)}
.tabs a[aria-current="page"]{background:var(--surface3);color:var(--lime)}
.field input,.field select{background:var(--surface);border-color:var(--surface3)}
.notice{background:var(--amber-bg);border-color:transparent}

/* ---- Gus dans l'accueil ---- */
.gus-intro{display:flex;align-items:flex-end;gap:12px;margin:6px 0 2px}
.gus-fig{flex:none;width:118px}
.gus-say{position:relative;margin:0 0 34px;padding:12px 14px;border-radius:18px 18px 18px 6px;background:var(--surface2);box-shadow:inset 0 1px 0 rgb(255 255 255/.08);font-size:.95rem;line-height:1.45}
@media (max-width:420px){.gus-fig{width:96px}.gus-fig .gus{width:96px;height:auto}}

/* ---- Ordinateur : menu à gauche, contenu en deux colonnes ---- */
@media (min-width:1024px){
  .wrap{max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr);column-gap:44px;padding-bottom:40px}
  .wrap > .top{grid-column:1 / -1}
  .wrap > main{grid-column:1}
  .tabs{position:fixed;top:86px;bottom:auto;right:auto;left:max(16px,calc((100vw - 1180px) / 2 + 16px));width:220px;padding:0;background:none}
  .tabs nav{flex-direction:column;max-width:none;border-radius:24px;padding:8px}
  .tabs a{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:.95rem;border-radius:18px}
  #view{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;padding-bottom:0}
  #view > :not(section), #view > section.hero, #view > section.stack{grid-column:1 / -1}
  #view > section[aria-labelledby="hT"], #view > section[aria-labelledby="pT"], #view > section:has(.toggle){grid-column:1 / -1}
  #vbody{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  #vbody > .hero, #vbody > .stack, #vbody > .notice, #vbody > .btn{grid-column:1 / -1}
  #view > .btn.big, #vbody .btn.big{max-width:420px}
  .gus-intro{max-width:760px}
}

/* Accueil : trajets favoris et tuiles */
.tchips{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.tchip{flex:none;border:0;border-radius:999px;padding:8px 14px;background:var(--surface2);color:var(--muted);font:700 .84rem var(--display);cursor:pointer;white-space:nowrap}
.tchip[aria-pressed="true"]{background:var(--surface3);color:var(--lime)}
.btn svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:grid;gap:3px;align-content:start;padding:16px;border-radius:20px;background:var(--surface);color:var(--fg);text-decoration:none;box-shadow:inset 0 1px 0 rgb(255 255 255/.06);min-height:112px}
.tile:hover{background:var(--surface2)}
.tile svg{width:26px;height:26px;fill:none;stroke:var(--lime);stroke-width:2;stroke-linecap:round;stroke-linejoin:round;margin-bottom:6px}
.tile b{font:700 1.02rem var(--head)}
.tile span{font-size:.8rem;color:var(--muted);line-height:1.3}
@media (min-width:1024px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ttrip{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:6px;align-items:center;padding:8px 10px;border-radius:12px;background:var(--surface2)}
.ttrip b{min-width:0;overflow-wrap:anywhere;font-size:.92rem}

/* Démo pour les juges */
.demo-card{border:1px solid color-mix(in srgb,var(--lime) 35%,transparent)!important;background:color-mix(in srgb,var(--lime) 6%,var(--surface))!important}
.demo-tag{justify-self:start;display:inline-flex;align-items:center;gap:6px;height:24px;padding:0 10px;border-radius:999px;background:var(--lime);color:#121417;font:800 .72rem var(--display);letter-spacing:.06em;text-transform:uppercase}
.dsteps{list-style:none;margin:0;padding:0;display:grid;gap:8px;counter-reset:d}
.dsteps li{display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;align-items:start;font-size:.92rem}
.dsteps li>span{min-width:0;overflow-wrap:anywhere}
.dsteps li::before{counter-increment:d;content:counter(d);display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--surface3);color:var(--lime);font:800 .8rem var(--head)}
.dsteps li.done::before{content:"✓";background:var(--lime);color:#121417}
.risk-note{margin:0;font-size:.8rem;color:var(--muted)}
.risk-note b{color:var(--orange)}
.rk{font:700 .74rem var(--display);color:var(--muted)}
.rk b{color:var(--fg)}
/* Mon mois */
.mgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.mgrid div{padding:14px;border-radius:16px;background:var(--surface2);display:grid;gap:2px}
.mgrid b{font:700 1.7rem/1.1 var(--head)}
.mgrid span{font-size:.8rem;color:var(--muted)}
.story-prev{width:min(260px,70%);justify-self:center;border-radius:18px;box-shadow:0 18px 40px rgb(0 0 0/.45)}
.monthnav{display:flex;gap:8px;align-items:center}
.lrows{display:grid;gap:8px}
.lrow{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;align-items:center;padding:10px 12px;border-radius:14px;background:var(--surface2)}
.lrow .lb{grid-row:1/3}
.lrow b{min-width:0;overflow-wrap:anywhere}
.lrow .s{grid-column:2;font-size:.8rem;color:var(--muted)}
.lrow .v{grid-row:1/3;grid-column:3;text-align:right;font:700 1.15rem var(--head);color:var(--orange)}
.lrow .v.ok{color:var(--ok)}
.lrow .v small{display:block;font:600 .68rem var(--display);color:var(--muted)}

/* Aide à la réclamation */
.claim .claimtop{display:grid;gap:4px;padding:14px;border-radius:14px;background:var(--surface2)}
.claim .pct{font:700 1.5rem/1.15 var(--head);color:var(--lime)}
.csteps{list-style:none;margin:0;padding:0;display:grid;gap:12px;counter-reset:c}
.csteps li{position:relative;display:grid;gap:6px;padding-left:38px;align-items:start}
.csteps li::before{counter-increment:c;content:counter(c);position:absolute;left:0;top:-2px;display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--surface3);color:var(--lime);font:800 .85rem var(--head)}
.csteps li.done::before{content:"✓";background:var(--lime);color:#121417}
.csteps .btn.sm,.claim .btn.sm{min-height:34px;padding:0 12px;font-size:.82rem;justify-self:start}
.crows{display:grid;gap:4px}
.crow{display:grid;grid-template-columns:minmax(0,9rem) minmax(0,1fr) auto;gap:8px;align-items:center;text-align:left;border:0;border-radius:10px;background:var(--surface2);color:var(--fg);font:500 .86rem var(--display);padding:8px 10px;cursor:pointer}
.crow:hover{background:var(--surface3)}
.crow .cp{color:var(--muted)}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rgrid > div{padding:12px;border-radius:12px;background:var(--surface2)}
@media (max-width:560px){.rgrid{grid-template-columns:1fr}}

<script src="config.js"></script>
<script src="lp-i18n.js"></script>
<script src="lp-ui.js"></script>
<script src="lp-core.js"></script>
<script src="gus.js"></script>

<script>Gus.fab({bottom: "92px"});</script>
<script>
"use strict";
const {rpc, store, fmt, esc, passkey} = LP;
const {L, locale} = LPI;
document.title = L("Mon espace : trajets, check-in et justificatifs | LateProof", "My space: trips, check-in and certificates | LateProof");
const $ = id => document.getElementById(id);
const view = $("view");
const now = () => Math.floor(Date.now() / 1000);
const GL = ["OUI", "OGO", "IC", "ICN", "LYR", "ICE", "TGV", "ES"];
const MODES = {OUI: "TGV INOUI", OGO: "OUIGO", IC: "Intercités", ICN: L("Intercités de nuit", "Intercités night train"), LYR: "Lyria", ICE: "ICE", TT: "Tram-train", TER: "TER",
  RER: "RER", TRANSILIEN: "Transilien", METRO: L("Métro", "Metro"), TRAM: "Tram"};
const modeName = (m, line) => { const n = MODES[m] || m || "Train"; return line && !/^\d{3}[A-Z]$/.test(line) && n !== line ? `${n} ${line}` : n; };
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function badge(delay, cancelled) {
  if (cancelled) return `<span class="d d-bad d-x">${L("supprimé", "cancelled")}</span>`;
  const m = fmt.min(delay);
  if (m < 1) return `<span class="d d-ok">${L("à l'heure", "on time")}</span>`;
  return `<span class="d ${m >= 15 ? "d-bad" : m >= 5 ? "d-mid" : "d-ok"}">+${m} min</span>`;
}
const spinner = txt => `<p class="muted"><span class="spin" aria-hidden="true"></span> ${esc(txt || L("Chargement…", "Loading…"))}</p>`;

// ================================================================= Donnees locales (restent sur l'appareil)
const db = {
  home: () => trips()[0] || null,                        // trajet principal (le premier des favoris)
  voyages: () => store.get("lpa-voyages", []),           // check-ins
  certs: () => store.get("lpa-certs", []),               // justificatifs crees
  email: () => store.get("lpa-email", ""),
  saveVoyages: v => store.set("lpa-voyages", v),
  saveCerts: v => store.set("lpa-certs", v),
};
const voyageById = id => db.voyages().find(v => v.id === id);
function updateCert(id, patch) { const all = db.certs(); const i = all.findIndex(x => x.id === id); if (i >= 0) { all[i] = {...all[i], ...patch}; db.saveCerts(all); } }

// ================================================================= Trajets favoris
// Une seule liste, partagée avec la carte (lp-favs, type « trip » : ⭐ sur un trajet de la carte l'ajoute ici) ;
// le trajet principal est noté à part (lpa-main) et sert à Gus (lp-trajet), à l'accueil et au check-in.
const rawLS = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
               set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
const tkey = t => `${t.a.net}|${t.a.id}>${t.b.net}|${t.b.id}`;
const endName = e => (e && ((e.place && e.place.label) || e.name)) || "?";
const tripName = t => `${endName(t.a)} → ${endName(t.b)}`;
const isTrip = f => f && f.t === "trip" && f.a && f.b && f.a.id && f.b.id;
function favAll() { try { return JSON.parse(rawLS.get("lp-favs") || "[]"); } catch (e) { return []; } }
function trips() {
  const l = favAll().filter(isTrip), main = store.get("lpa-main"), i = l.findIndex(t => tkey(t) === main);
  if (i > 0) l.unshift(l.splice(i, 1)[0]);
  return l;
}
function saveTrips(list) {
  const others = favAll().filter(f => !isTrip(f));
  rawLS.set("lp-favs", JSON.stringify([...list, ...others].slice(0, 40)));
  store.set("lpa-main", list[0] ? tkey(list[0]) : null);
  store.set("lp-trajet", list[0] ? tripName(list[0]) : null);
}
function addTrip(a, b, main) {
  const t = {t: "trip", a, b, name: `${endName(a)} → ${endName(b)}`};
  const l = trips().filter(x => tkey(x) !== tkey(t));
  if (main || !l.length) l.unshift(t); else l.push(t);
  saveTrips(l); return t;
}
const tripHash = (t, go) => `carte.html#trajet=${encodeURIComponent(t.a.net + "|" + t.a.id + ">" + t.b.net + "|" + t.b.id)}${go ? "&go=1" : ""}`;
// Ancien format (un seul trajet, lpa-home) : repris une fois dans les favoris
(() => { const h = store.get("lpa-home"); if (h && h.a && h.b && h.a.id && h.b.id) { addTrip(h.a, h.b, true); store.set("lpa-home", null); } })();
// Trajet tapé dans Gus (texte « Lyon → Grenoble ») sans favori : on retrouve les gares une fois
async function tripFromGus() {
  if (trips().length) return false;
  const txt = store.get("lp-trajet"); if (!txt || typeof txt !== "string") return false;
  const parts = txt.split(/\s*(?:→|->|>|–|—| - )\s*/).filter(Boolean); if (parts.length !== 2) return false;
  try {
    const [ra, rb] = await Promise.all(parts.map(q => rpc("public_find_stop", {p_q: q})));
    const a = ra && ra[0], b = rb && rb[0]; if (!a || !b) return false;
    addTrip({net: a.net, id: a.id, name: a.name, lat: +a.lat, lon: +a.lon}, {net: b.net, id: b.id, name: b.name, lat: +b.lat, lon: +b.lon}, true);
    return true;
  } catch (e) { return false; }
}
function updateVoyage(id, patch) { const all = db.voyages(); const i = all.findIndex(v => v.id === id); if (i >= 0) { all[i] = {...all[i], ...patch}; db.saveVoyages(all); return all[i]; } }
const uid = () => LP.hex(crypto.getRandomValues(new Uint8Array(6)));

// ================================================================= Recherche de gare (champ reutilisable)
function stationField(id, label, value, onPick, placeholder) {
  setTimeout(() => {
    const input = $(id), list = $(id + "L"); if (!input) return;
    let opts = [], t = null;
    const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); };
    const show = () => {
      if (!opts.length) return close();
      list.innerHTML = opts.map((o, i) => `<li role="option" data-i="${i}"><span>${esc(o.name)}</span><span class="x">${o.net === "idf" ? "Île-de-France" : "SNCF"}</span></li>`).join("");
      list.hidden = false; input.setAttribute("aria-expanded", "true");
    };
    input.addEventListener("input", () => {
      clearTimeout(t); const q = input.value.trim(); if (q.length < 2) { opts = []; return close(); }
      t = setTimeout(() => rpc("public_find_stop", {p_q: q}).then(r => { if (input.value.trim() === q) { opts = r || []; show(); } }).catch(() => {}), 220);
    });
    input.addEventListener("keydown", e => { if (e.key === "Enter" && opts[0] && !list.hidden) { e.preventDefault(); pick(0); } if (e.key === "Escape") close(); });
    const pick = i => { const o = opts[i]; input.value = o.name; close(); onPick({net: o.net, id: o.id, name: o.name, lat: +o.lat, lon: +o.lon}); };
    list.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
    input.addEventListener("blur", () => setTimeout(close, 150));
  });
  return `<label class="field" for="${id}">${esc(label)}<div class="combo"><input id="${id}" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="${id}L" placeholder="${esc(placeholder || L("Nom de la gare", "Station name"))}" value="${esc(value || "")}"><ul class="sugg" id="${id}L" role="listbox" hidden></ul></div></label>`;
}

// ================================================================= Routeur
const routes = [];
const route = (re, fn, tab) => routes.push({re, fn, tab});
async function render() {
  const h = location.hash.replace(/^#/, "") || "/";
  if (!store.get("lpa-onboarded") && h === "/") {
    // Déjà utilisé ailleurs (trajet favori sur la carte, trajet dit à Gus, voyages) : pas de tutoriel
    if (trips().length || store.get("lp-trajet") || db.voyages().length || db.certs().length) store.set("lpa-onboarded", true);
    else { location.replace("#/bienvenue"); return; }
  }
  for (const r of routes) {
    const m = h.match(r.re);
    if (m) {
      document.querySelectorAll(".lpt a[data-tab]").forEach(a => { if (a.dataset.tab === r.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
      window.scrollTo(0, 0);
      await r.fn(...m.slice(1));
      return;
    }
  }
  location.replace("#/");
}
window.addEventListener("hashchange", render);

// ================================================================= Bienvenue (premiere visite)
route(/^\/bienvenue$/, () => {
  let step = 0; const tmp = {a: null, b: null};
  const draw = () => {
    const dots = `<div class="steps" aria-hidden="true">${[0, 1, 2].map(i => `<span class="${i <= step ? "on" : ""}">${i + 1}</span>`).join("")}</div>`;
    const GUS = [["salut", "content", L("Salut, moi c'est Gus ! Je surveille tes trains et je composte la preuve quand ils sont en retard.", "Hi, I'm Gus! I watch your trains and stamp the proof when they run late.")],
      ["billet", "neutre", L("Dis-moi quel train tu prends : je le surveille chaque matin pour toi.", "Tell me which train you take: I'll watch it for you every morning.")],
      ["repos", "content", L("Ta clé signe tes justificatifs. Même moi, je ne peux pas en faire à ta place.", "Your key signs your certificates. Not even I can make one for you.")]][step];
    const gusIntro = `<div class="gus-intro"><div class="gus-fig">${Gus.svg({pose: GUS[0], mood: GUS[1], size: 118})}</div><p class="gus-say">${GUS[2]}</p></div>`;
    if (step === 0) view.innerHTML = dots + gusIntro + L(`<h1>Bienvenue sur LateProof</h1>
      <div class="card"><p><b>Ton copilote quand le train déraille.</b> Le retard de ton trajet en direct, un plan B, et quand tu arrives en retard, un <b>justificatif infalsifiable</b> que ton employeur ou ton prof vérifie en 3 secondes, sans rien installer.</p>
      <p class="muted small">Tes trajets, tes justificatifs et ta clé restent sur ce téléphone. Tu décides seul de ce que tu montres, et à qui.</p></div>
      <button class="btn primary big" id="next">Commencer</button><a class="btn" href="#/demo">Essayer la démo en 30 s</a><button class="btn ghost" id="skip">Passer</button>`, `<h1>Welcome to LateProof</h1>
      <div class="card"><p><b>Your copilot when the train goes off the rails.</b> Your trip's delay live, a plan B, and when you arrive late, a <b>tamper-proof certificate</b> your employer or teacher checks in 3 seconds, with nothing to install.</p>
      <p class="muted small">Your trips, your certificates and your key stay on this phone. You alone decide what you show, and to whom.</p></div>
      <button class="btn primary big" id="next">Get started</button><a class="btn" href="#/demo">Try the 30-second demo</a><button class="btn ghost" id="skip">Skip</button>`);
    if (step === 1) view.innerHTML = dots + gusIntro + `<h1>${L("Ton trajet habituel", "Your usual trip")}</h1><p class="sub">${L("Pour te prévenir dès qu'il y a un problème. Tu pourras le changer plus tard.", "So I can warn you as soon as there's a problem. You can change it later.")}</p>
      <div class="card">${stationField("oa", L("Départ", "From"), tmp.a && tmp.a.name, s => tmp.a = s)}${stationField("ob", L("Arrivée", "To"), tmp.b && tmp.b.name, s => tmp.b = s)}</div>
      <button class="btn primary big" id="next">${L("Continuer", "Continue")}</button><button class="btn ghost" id="skip">${L("Plus tard", "Later")}</button>`;
    if (step === 2) view.innerHTML = dots + gusIntro + L(`<h1>La clé de ton téléphone</h1>
      <div class="card"><p>Tes justificatifs sont <b>signés par ton téléphone</b>, avec ton visage, ton empreinte ou ton code, comme pour un paiement. Personne d'autre ne peut en créer à ton nom, pas même LateProof.</p>
      <p class="muted small">La clé ne quitte jamais ton téléphone. Tu peux aussi la créer au moment de ton premier justificatif.</p></div>
      <button class="btn primary big" id="next">Créer ma clé</button><button class="btn ghost" id="skip">Plus tard</button>`, `<h1>Your phone's key</h1>
      <div class="card"><p>Your certificates are <b>signed by your phone</b>, with your face, fingerprint or PIN, like a payment. Nobody else can create one in your name, not even LateProof.</p>
      <p class="muted small">The key never leaves your phone. You can also create it when you make your first certificate.</p></div>
      <button class="btn primary big" id="next">Create my key</button><button class="btn ghost" id="skip">Later</button>`);
    $("next").onclick = async () => {
      if (step === 1 && tmp.a && tmp.b) addTrip(tmp.a, tmp.b, true);
      if (step === 2) { if (await ensureKey()) finish(); return; }
      step++; draw();
    };
    $("skip").onclick = () => { if (step === 0 || step === 2) finish(); else { step++; draw(); } };
  };
  const finish = () => { store.set("lpa-onboarded", true); location.hash = "#/"; };
  draw();
}, "home");

// ================================================================= Démo pour les juges
// De vrais trains en retard d'hier (relevés SNCF, déjà scellés sur Solana quand c'est possible), ajoutés comme voyages
// « démo » : on peut tout essayer (retard, réclamation, justificatif, vérification, bilan du mois) sans prendre le train.
// Les voyages démo sont marqués et « Quitter la démo » n'efface qu'eux.
const PRICE_DEMO = {OUI: 59, OGO: 25, IC: 32, ICN: 45, LYR: 79};
function clearDemo() {
  const ids = new Set(db.voyages().filter(v => v.demo).map(v => v.id));
  db.saveVoyages(db.voyages().filter(v => !v.demo));
  db.saveCerts(db.certs().filter(c => !ids.has(c.voyage)));
  store.set("lpa-demo", null);
}
function quitDemo() { if (!confirm(L("Quitter la démo ? Les voyages et justificatifs de démo sont effacés de ce téléphone. Tes vrais voyages ne bougent pas.", "Leave the demo? Demo trips and certificates are erased from this phone. Your real trips stay."))) return; clearDemo(); toast(L("Démo terminée", "Demo ended")); location.hash = "#/"; }
route(/^\/demo$/, async () => {
  view.innerHTML = `<span class="demo-tag">${L("Démo", "Demo")}</span><h1>${L("On prépare la démo", "Setting up the demo")}</h1>${spinner(L("On cherche un vrai train en retard d'hier…", "Finding a real train that was late yesterday…"))}`;
  let list = [];
  try { list = await rpc("public_demo_trips", {}); } catch (e) {}
  if (!list || !list.length) { view.innerHTML = `<h1>${L("Démo indisponible", "Demo unavailable")}</h1><p class="muted">${L("Aucun train en retard trouvé dans nos relevés d'hier. Réessaie dans quelques minutes.", "No late train found in yesterday's records. Try again in a few minutes.")}</p><a class="btn" href="#/">${L("Retour", "Back")}</a>`; return; }
  clearDemo();
  const vs = list.map(x => ({id: uid(), demo: true, day: x.day, net: "sncf", num: x.num, mode: x.mode, line: x.line, dest: x.to.name, sched: x.sched,
    from: {name: x.from.name, id: x.from.id, net: "sncf", lat: +x.from.lat, lon: +x.from.lon}, checkin: x.sched - 240, geo: null,
    to: {stop: x.to.stop, name: x.to.name}, result: {delay: x.delay, cancelled: false, sched_arr: x.sched_arr, rec: null},
    price: PRICE_DEMO[x.mode] || null, sealed: !!x.sealed}));
  db.saveVoyages(db.voyages().concat(vs.reverse()).slice(-200));
  store.set("lpa-demo", true); store.set("lpa-onboarded", true);
  location.replace("#/voyage/" + vs[vs.length - 1].id);
}, "voyages");
function demoGuide(v, trip) {
  const cert = db.certs().find(c => c.voyage === v.id);
  const P = claimPlan([v], trip);
  return `<section class="card demo-card lp-lift"><span class="demo-tag">${L("Démo · 30 secondes", "Demo · 30 seconds")}</span>
    <p style="margin:0">${L(`Un <b>vrai train d'hier</b>, d'après les relevés officiels SNCF : <b>+${fmt.min(trip.delay)} min</b> à l'arrivée${v.sealed ? ", et ce jour est déjà <b>scellé sur Solana</b>" : ""}. Personne n'était à bord : le justificatif le dira.`,
      `A <b>real train from yesterday</b>, from official SNCF records: <b>+${fmt.min(trip.delay)} min</b> on arrival${v.sealed ? ", and that day is already <b>sealed on Solana</b>" : ""}. Nobody was on board: the certificate will say so.`)}</p>
    <ol class="dsteps">
      <li class="done"><span>${L("Le retard officiel, gare par gare (ci-dessous)", "The official delay, stop by stop (below)")}</span></li>
      <li><span>${P.pct ? L(`La compensation : <b>${P.pct} %</b> du billet avec ${esc(P.name)}`, `The compensation: <b>${P.pct}%</b> of the ticket with ${esc(P.name)}`) : L("Tes droits à compensation", "Your compensation rights")} · <a href="#claimCard">${L("voir", "see")}</a></span></li>
      <li class="${cert ? "done" : ""}"><span>${cert ? `<a href="${esc(cert.url)}" target="_blank" rel="noopener">${L("Vérifier le justificatif et le sceau Solana", "Check the certificate and the Solana seal")} ↗</a>` : `<a href="#/nouveau/${v.id}">${L("Créer le justificatif signé par ce téléphone", "Create the certificate signed by this phone")}</a>`}</span></li>
      <li><span><a href="#/mois">${L("Le bilan du mois en story, avec le résumé vocal", "The monthly summary as a story, with the voice summary")}</a></span></li>
    </ol>
    <button class="btn ghost" id="quitDemo">${L("Quitter la démo", "Leave the demo")}</button></section>`;
}

// ================================================================= Cle du telephone
async function ensureKey() {
  if (passkey.get()) return passkey.get();
  try {
    if (passkey.supported()) { const k = await passkey.create(db.email() || L("Mon téléphone", "My phone")); toast(L("Clé créée sur ce téléphone", "Key created on this phone")); return k; }
  } catch (e) {
    if (!confirm(L("La clé sécurisée du téléphone (passkey) n'a pas pu être créée sur cet appareil.\n\nUtiliser une clé du navigateur à la place ? Elle fonctionne, mais sans déverrouillage par visage ou empreinte, et le justificatif l'indiquera.", "The phone's secure key (passkey) could not be created on this device.\n\nUse a browser key instead? It works, but without face or fingerprint unlock, and the certificate will say so."))) return null;
  }
  try { const k = await passkey.createBrowserKey(); toast(L("Clé du navigateur créée", "Browser key created")); return k; } catch (e) { toast(L("Impossible de créer une clé sur ce navigateur", "Could not create a key in this browser")); return null; }
}

// ================================================================= Aujourd'hui
let selTrip = 0;
const ICO = {
  month: '<svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  rank: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
  risk: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 17l5-5 4 4 8-8"/><path d="M15 8h5v5"/></svg>',
  demo: '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M10 8.5v7l6-3.5z"/></svg>',
  plus: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  go: '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 11l18-8-8 18-2-8z"/></svg>',
};
route(/^\/$/, async () => {
  if (!trips().length && await tripFromGus()) selTrip = 0;
  const list = trips(), today = fmt.ymd(now());
  if (selTrip >= list.length) selTrip = 0;
  const home = list[selTrip] || null;
  const running = db.voyages().filter(v => v.day === today && now() - v.checkin < 5 * 3600).slice(-1)[0];
  const tile = (href, ico, t, sub) => `<a class="tile" href="${href}">${ico}<b>${t}</b><span>${sub}</span></a>`;
  view.innerHTML = `<h1>${esc(cap(fmt.day(now())))}</h1>
    ${running ? `<a class="card hero lp-lift" href="#/voyage/${running.id}" style="text-decoration:none;color:inherit"><span class="kicker">${L("En cours", "Now")}</span>
      <div class="between"><b>${esc(modeName(running.mode, running.line))} · ${esc(running.num)}</b><span id="runSt">${spinnerInline()}</span></div>
      <span class="muted small">${L("Depuis", "From")} ${esc(running.from.name)}${running.dest ? ` ${L("vers", "to")} ${esc(running.dest)}` : ""}</span></a>` : ""}
    <a class="btn primary big" href="#/checkin">${L("Je suis à bord", "I'm on board")}</a>
    ${store.get("lpa-demo") ? `<div class="row"><span class="demo-tag">${L("Démo active", "Demo on")}</span><a class="btn" href="#/voyages">${L("Voir les voyages de démo", "See the demo trips")}</a><button class="btn ghost" id="quitDemo">${L("Quitter la démo", "Leave the demo")}</button></div>` : ""}
    <section class="card lp-ticket" aria-labelledby="hT"><div class="between"><h2 id="hT">${list.length > 1 ? L("Mes trajets", "My trips") : L("Mon trajet", "My trip")}</h2><a class="small" href="#/profil/trajets">${list.length ? L("Gérer", "Manage") : ""}</a></div>
      ${home ? `${list.length > 1 ? `<div class="tchips" role="group" aria-label="${L("Mes trajets favoris", "My favourite trips")}">${list.map((t, i) => `<button class="tchip" data-ti="${i}" aria-pressed="${i === selTrip}">${i === 0 ? "★ " : ""}${esc(tripName(t))}</button>`).join("")}</div>` : `<p class="muted small" style="margin:0">${esc(tripName(home))}</p>`}
        <div class="row"><a class="btn primary" href="${tripHash(home, true)}">${ICO.go} ${L("Lancer avec le meilleur trajet", "Start with the best route")}</a><a class="btn" href="${tripHash(home)}">${L("Voir les options", "See the options")}</a></div>
        <span class="lp-perf" aria-hidden="true"></span>

// Prévision expérimentale : part des trains de la ligne arrivés à +15 min dans notre historique (quelques jours seulement)
async function showRisk() {
  const els = [...view.querySelectorAll("[data-risk]")]; if (!els.length) return;
  const want = {}; els.forEach(e => JSON.parse(e.dataset.risk).forEach(([n, id]) => (want[n] = want[n] || new Set()).add(id)));
  const res = {}; let span = null;
  await Promise.all(Object.entries(want).map(([n, ids]) => rpc("public_line_risk", {p_net: n, p_ids: [...ids]}).then(r => { span = r.span; r.lines.forEach(l => res[n + "|" + l.id] = l); }).catch(() => {})));
  let any = false;
  els.forEach(e => {
    const ls = JSON.parse(e.dataset.risk).map(([n, id]) => res[n + "|" + id]).filter(Boolean); if (!ls.length) return;
    const p = Math.round(100 * (1 - ls.reduce((a, l) => a * (1 - l.p15 / 100), 1))); any = true;
    e.innerHTML = `${L("Risque de retard de +15 min", "Risk of a 15+ min delay")} : <b>${p} %</b> · ${L("sur", "from")} ${Math.min(...ls.map(l => l.n)).toLocaleString(locale)} ${L("trains observés", "trains observed")}`;
  });
  const box = $("opts"); if (any && box && span) box.insertAdjacentHTML("afterbegin", `<p class="risk-note"><b>${L("Prévision expérimentale", "Experimental forecast")}</b> · ${L(`basée sur ${span.days} jours de relevés seulement : indicative`, `based on only ${span.days} days of records: indicative`)} · <a href="classement.html#risk">${L("méthode", "method")}</a></p>`);
}
const spinnerInline = () => `<span class="spin" aria-label="${L("Chargement", "Loading")}"></span>`;
function best(js) {   // partir plus tard ET arriver plus tot : on ne garde que les meilleures options
  const rt = (t, d) => t + Math.max(d || 0, 0), dep = j => rt(j.legs[0].dep, j.legs[0].dep_delay), arr = j => rt(j.arr, j.arr_delay);
  const s = [...js].sort((a, b) => dep(a) - dep(b)); const out = []; let b = Infinity;
  for (let i = s.length - 1; i >= 0; i--) if (arr(s[i]) < b) { out.unshift(s[i]); b = arr(s[i]); }
  return out;
}
async function refreshRunning(v) {
  try {
    const t = await trainOf(v); const el = $("runSt"); if (!el) return;
    const st = (v.to && t.stops.find(s => s.stop === v.to.stop)) || t.stops[t.stops.length - 1];

  } catch (e) { const el = $("runSt"); if (el) el.textContent = ""; }
}

const trainCache = new Map();
async function trainOf(v) {
  const k = `${v.net}|${v.num}|${v.day}`;
  if (trainCache.has(k) && Date.now() - trainCache.get(k).at < 60000) return trainCache.get(k).t;

}

// Horaires du train + gare d'arrivee (choisie, ou trajet habituel s'il est sur la ligne, ou terminus) -> retard a l'arrivee
async function resolveLeg(v) {
  const t = await trainOf(v);
  const i0 = Math.max(0, t.stops.findIndex(s => s.stop === v.from.id || norm(s.name) === norm(v.from.name)));
  const after = t.stops.slice(i0);
  let to = v.to;

const recipient = () => store.get("lpa-recipient") || null;   // {name, email, sign, auto}

function mailOf(c) {

  const body = L(`Bonjour${r.name ? " " + r.name : ""},\n\nMon train du ${d} est arrivé avec ${fmt.min(c.delay)} minutes de retard (${c.label}${c.to ? ", arrivée à " + c.to : ""}).\n\n` +
      `Voici le justificatif. Il se vérifie en quelques secondes, sans compte ni appli, à partir des relevés officiels SNCF scellés sur la blockchain Solana :\n${c.url}\n\n` +
      `Code du justificatif : ${c.code}\n\nBonne journée,\n${r.sign || ""}`,
    `Hello${r.name ? " " + r.name : ""},\n\nMy train on ${d} arrived ${fmt.min(c.delay)} minutes late (${c.label}${c.to ? ", arriving at " + c.to : ""}).\n\n` +

const MONTHS_FR = ["janvier", "février", "mars", "avril", "mai", "juin", "juillet", "août", "septembre", "octobre", "novembre", "décembre"];
const MONTHS_EN = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
const hm = m => m >= 60 ? `${Math.floor(m / 60)} h ${String(m % 60).padStart(2, "0")}` : `${m} min`;
function monthStats(ym) {
  const vs = db.voyages().filter(v => v.day && v.day.startsWith(ym));
  const groups = {}; vs.forEach(v => (groups[v.group || v.id] = groups[v.group || v.id] || []).push(v));
  const trips = Object.values(groups).map(g => g.sort((a, b) => a.sched - b.sched)).filter(g => g[g.length - 1].result);
  let late = 0, minutes = 0, worst = 0, worstTrip = null, claims = 0, euros = 0, priced = 0, demo = false;
  trips.forEach(g => {
    const t = tripTotal(g), m = fmt.min(t.delay); if (g.some(v => v.demo)) demo = true;
    if (m >= 5 || t.cancelled) late++;
    minutes += m; if (m > worst) { worst = m; worstTrip = g; }
    const P = claimPlan(g, t);
    if ((P.pct > 0 || t.cancelled) && !g[0].claimed) { claims++; if (g[0].price && P.pct) { euros += g[0].price * P.pct / 100; priced++; } }
  });
  const certs = db.certs().filter(c => c.day && c.day.startsWith(ym)).length;
  return {n: trips.length, late, minutes, worst, worstTrip, claims, euros: Math.round(euros * 100) / 100, priced, certs, demo};
}

    const l = {net: v.net, mode: v.mode, name: v.line || ""}, i = LPLines.info(l), k = v.net + "|" + i.label;
    const m = map[k] = map[k] || {l, i, n: 0, late: 0, min: 0, demo: false, routes: []};
    const rt = `${v.from.name} → ${v.to ? v.to.name : v.dest || "?"}`; if (!m.routes.includes(rt)) m.routes.push(rt);
    m.n++; const d = fmt.min(v.result.delay); if (d >= 5 || v.result.cancelled) m.late++; m.min += d; if (v.demo) m.demo = true;
  });
  const mine = Object.values(map).sort((a, b) => b.late - a.late || b.min - a.min || b.n - a.n);
  let span = null;
  try { if (!WORST) [WORST, span] = await Promise.all([rpc("public_worst_lines", {p_days: 7}), rpc("public_data_span", {})]); else span = await rpc("public_data_span", {}); } catch (e) {}
  const W = WORST || {worst: [], metro: []};
  const rankOf = m => { const idx = W.worst.findIndex(x => (x.net === "idf" ? x.id === m.i.id : x.name === m.l.name && x.net === m.l.net)); return idx >= 0 ? idx + 1 : 0; };
  const top = [...W.worst.slice(0, 5), ...(W.metro || []).slice(0, 3)];
  const title = m => m.l.net === "idf" ? m.i.label : m.routes[0] + (m.routes.length > 1 ? ` +${m.routes.length - 1}` : "");
  box.innerHTML = `<h2>${L("Mes lignes ce mois-ci", "My lines this month")}</h2>
    <div class="lrows">${mine.map(m => { const r = rankOf(m), avg = Math.round(m.min / m.n);
      return `<div class="lrow"><span class="lb">${LPLines.badge(m.l, true)}</span><b>${esc(title(m))}</b>
        <span class="v${m.late ? "" : " ok"}">${m.late}/${m.n}<small>${L("en retard", "late")}</small></span>
        <span class="s">${L(`${m.n} trajet(s) · +${avg} min en moyenne`, `${m.n} trip(s) · +${avg} min on average`)}${r ? ` · <b style="color:var(--orange)">${L(`n° ${r} des plus en retard cette semaine`, `#${r} most delayed this week`)}</b>` : ""}</span></div>`; }).join("")}</div>
    ${top.length ? `<h2 style="margin-top:6px">${L("Les plus en retard cette semaine", "Most delayed this week")}</h2>
    <p class="risk-note"><b>${L("Expérimental", "Experimental")}</b> · ${L(`basé sur ${span ? span.days : "quelques"} jours de relevés seulement`, `based on only ${span ? span.days : "a few"} days of records`)} · <a href="classement.html">${L("classement complet", "full ranking")}</a></p>
    <div class="lrows">${top.map(x => `<div class="lrow"><span class="lb">${LPLines.badge(x, true)}</span><b>${esc(x.net === "sncf" ? (x.long || "").replace(/\s+-\s+/g, " – ") : LPLines.info(x).label)}</b>
      <span class="v">${Math.round(x.pct15)} %<small>${L("à +15 min", "at +15 min")}</small></span><span class="s">${esc(x.net === "idf" && /METRO|TRAM/.test(x.mode) ? L("métro / tram · mesuré par l'intervalle entre rames", "metro / tram · measured by the interval between trains") : `${x.n} ${L("trains en 7 jours", "trains in 7 days")}`)}</span></div>`).join("")}</div>` : ""}
    <div class="row"><button class="btn primary" id="mkLines">${L("Story de mes lignes", "Story of my lines")}</button><button class="btn primary" id="shLines" hidden>${L("Partager ou enregistrer", "Share or save")}</button></div>
    <img id="lprev" class="story-prev" alt="" hidden>`;
  $("mkLines").onclick = async () => {
    const b = $("mkLines"); b.disabled = true;
    try {
      const rows = [{section: L("Mes lignes", "My lines")}];
      for (const m of mine.slice(0, 3)) rows.push({value: `${m.late}/${m.n}`, label: title(m), sub: L(`en retard · +${Math.round(m.min / m.n)} min en moyenne`, `late · +${Math.round(m.min / m.n)} min on average`), color: m.late ? "#FF8A5C" : "#3DD68C", badge: await LPLines.forStory(m.l)});
      const tops = [...W.worst.slice(0, 2), ...(W.metro || []).slice(0, 1)];
      if (tops.length) { rows.push({section: L("Les pires de la semaine en France", "France's worst this week")});
        for (const x of tops) rows.push({value: `${Math.round(x.pct15)} %`, label: x.net === "sncf" ? (x.long || "").replace(/\s+-\s+/g, " – ") : LPLines.info(x).label, sub: L("des trains à +15 min", "of trains at +15 min"), color: "#FF8A5C", badge: await LPLines.forStory(x)}); }
      const blob = await LPStory.draw({kicker: L(`Mes lignes de ${mName}`, `My lines in ${mName}`), title: L("Mes lignes, et les pires de la semaine", "My lines, and the week's worst"), rows,
        note: (mine.some(m => m.demo) ? L("Exemple de démo. ", "Demo example. ") : "") + L(`Classement basé sur ${span ? span.days : "quelques"} jours de relevés seulement : indicatif.`, `Ranking based on only ${span ? span.days : "a few"} days of records: indicative.`)});
      $("lprev").src = URL.createObjectURL(blob); $("lprev").hidden = false; $("lprev").alt = L("Aperçu de la story de mes lignes", "Preview of my lines story");
      b.hidden = true; $("shLines").hidden = false;
      $("shLines").onclick = async () => { const r = await LPStory.share(blob, `lateproof-lignes-${ym}.png`, L("Mes lignes avec LateProof", "My lines with LateProof")); if (r === "downloaded") toast(L("Image téléchargée", "Image downloaded")); };
    } finally { b.disabled = false; }
  };
}

// ================================================================= Réglages : toutes les préférences au même endroit
// (langue, trajet habituel, position, favoris, carte, Gus et micro, e-mail, clé, données). Tout reste sur ce téléphone.
// Formats : la carte garde lp-profile / lp-region / lp-base / lp-pos / lp-favs en texte brut ; Gus garde lp-speak, lp-handsfree,
// lp-stt, lp-trajet en JSON ; Mon espace passe par LP.store (JSON).
const raw = {get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } },
             set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} }};
const REGIONS = [["", L("Toute la France", "All of France")], ["idf", "Île-de-France"], ["hdf", "Hauts-de-France"], ["nor", "Normandie"], ["ges", "Grand Est"], ["bre", "Bretagne"],
  ["pdl", "Pays de la Loire"], ["cvl", "Centre-Val de Loire"], ["bfc", "Bourgogne-Franche-Comté"], ["naq", "Nouvelle-Aquitaine"], ["ara", "Auvergne-Rhône-Alpes"],
  ["occ", "Occitanie"], ["pac", "Provence-Alpes-Côte d'Azur"], ["cor", "Corse"]];
const sel = (id, opts, cur) => `<select id="${id}">${opts.map(([v, t]) => `<option value="${esc(v)}"${v === cur ? " selected" : ""}>${esc(t)}</option>`).join("")}</select>`;
const sw = (id, on, title, sub) => `<label class="toggle" for="${id}"><span class="lbl">${title}${sub ? `<small>${sub}</small>` : ""}</span><span class="switch"><input type="checkbox" id="${id}"${on ? " checked" : ""}><span></span></span></label>`;
route(/^\/profil(?:\/(\w+))?$/, async anchor => {
  const pk = passkey.get(), tmp = {a: null, b: null}, tl = trips();
  let pos = null; try { pos = JSON.parse(raw.get("lp-pos")); } catch (e) {}
  let favs = []; try { favs = JSON.parse(raw.get("lp-favs") || "[]"); } catch (e) {}
  const jget = k => { try { return JSON.parse(raw.get(k)); } catch (e) { return null; } };
  let mic = "unknown"; try { mic = (await navigator.permissions.query({name: "microphone"})).state; } catch (e) {}
  const micTxt = {granted: L("autorisé", "allowed"), denied: L("bloqué dans les réglages du navigateur", "blocked in the browser settings"), prompt: L("pas encore demandé", "not asked yet"), unknown: L("inconnu", "unknown")}[mic] || mic;
  const KIND = {station: L("Gare", "Station"), line: L("Ligne", "Line"), trip: L("Trajet", "Trip"), place: L("Lieu", "Place"), region: L("Région", "Region")};
  view.innerHTML = `<h1>${L("Réglages", "Settings")}</h1><p class="sub">${L("Toutes tes préférences, au même endroit. Elles restent sur ce téléphone.", "All your preferences in one place. They stay on this phone.")}</p>
    <section class="card"><h2>${L("Langue", "Language")}</h2>
      <div class="row"><button class="btn${LPI.lang === "fr" ? " primary" : ""}" data-lang="fr">Français</button><button class="btn${LPI.lang === "en" ? " primary" : ""}" data-lang="en">English</button></div></section>
    <section class="card" id="sec-trajets"><h2>${L("Mes trajets favoris", "My favourite trips")}</h2>
      ${tl.length ? `<div class="list">${tl.map((t, i) => `<div class="ttrip"><b>${i === 0 ? "★ " : ""}${esc(tripName(t))}${i === 0 ? ` <span class="muted small">(${L("principal", "main")})</span>` : ""}</b>
        ${i ? `<button class="btn ghost" data-tmain="${i}" title="${L("En faire le trajet principal", "Make it the main trip")}" aria-label="${L("En faire le trajet principal", "Make it the main trip")}">★</button>` : "<span></span>"}
        <button class="btn ghost" data-tdel="${i}" aria-label="${L("Retirer", "Remove")} ${esc(tripName(t))}">✕</button></div>`).join("")}</div>`
        : `<p class="muted small" style="margin:0">${L("Aucun trajet pour l'instant.", "No trip yet.")}</p>`}
      ${stationField("pa", L("Départ", "From"), "", s => { tmp.a = s; })}
      ${stationField("pb", L("Arrivée", "To"), "", s => { tmp.b = s; })}
      <button class="btn primary" id="tAdd">${L("Ajouter ce trajet", "Add this trip")}</button>
      <p class="muted small" style="margin:0">${L("Le trajet ★ principal sert à l'écran Aujourd'hui, au check-in et à Gus. Les trajets marqués ☆ sur la carte apparaissent aussi ici.", "The ★ main trip is used by the Today screen, check-in and Gus. Trips starred ☆ on the map show up here too.")}</p></section>
    <section class="card"><h2>${L("Ma position", "My location")}</h2>
      <p style="margin:0">${pos ? esc(pos.label || L("Position enregistrée", "Saved location")) : `<span class="muted">${L("Pas encore définie.", "Not set yet.")}</span>`}</p>
      <div class="row"><button class="btn" id="posGeo">${L("Me localiser", "Locate me")}</button><a class="btn" href="carte.html">${L("Choisir sur la carte", "Pick on the map")}</a>${pos ? `<button class="btn ghost" id="posClear">${L("Effacer", "Clear")}</button>` : ""}</div>
      <p class="muted small" style="margin:0">${L("Sert à « Autour de moi » et aux itinéraires depuis ta position. Pendant « Lancer mon trajet », la position est lue en direct et n'est pas gardée.", "Used for “Around me” and journeys from your location. During “Start my trip”, the location is read live and not kept.")}</p></section>
    <section class="card"><h2>${L("Mes favoris", "My favourites")}</h2>
      ${favs.length ? `<div class="list">${favs.map((f, i) => `<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><span style="min-width:0"><span class="muted small">${esc(KIND[f.t] || "")}</span> ${esc(f.name || "")}</span><button class="btn ghost" data-unfav="${i}" aria-label="${L("Retirer", "Remove")} ${esc(f.name || "")}">✕</button></div>`).join("")}</div>`
        : `<p class="muted small" style="margin:0">${L("Aucun favori. Sur la carte, touche ☆ sur une gare, une ligne ou un trajet.", "No favourites. On the map, tap ☆ on a station, line or trip.")}</p>`}</section>
    <section class="card"><h2>${L("Carte", "Map")}</h2>
      <label class="field" for="prof">${L("Je voyage surtout", "I mostly travel")}${sel("prof", [["quotidien", L("Au quotidien", "Daily")], ["grandes_lignes", L("En grandes lignes", "Long distance")], ["les_deux", L("Les deux", "Both")]], raw.get("lp-profile") || "les_deux")}</label>
      <label class="field" for="reg">${L("Ma région", "My region")}${sel("reg", REGIONS, raw.get("lp-region") || "")}</label>
      <label class="field" for="bas">${L("Fond de carte", "Map style")}${sel("bas", [["plan", L("Plan", "Map")], ["light", L("Clair", "Light")], ["dark", L("Sombre", "Dark")], ["osm", L("Détaillé (OSM)", "Detailed (OSM)")]], raw.get("lp-base") || "dark")}</label></section>
    <section class="card"><h2>${L("Gus et micro", "Gus and microphone")}</h2>
      <div>${sw("spk", jget("lp-speak") === true, L("Lire les réponses à voix haute", "Read answers aloud"))}
      ${sw("hf", jget("lp-handsfree") === true, L("Conversation à la voix", "Voice conversation"), L("Le micro se rouvre après chaque réponse de Gus.", "The microphone reopens after each answer from Gus."))}
      ${sw("srv", jget("lp-stt") === "server", L("Dictée par enregistrement", "Dictation by recording"), L("Si la dictée du navigateur ne marche pas : le son est envoyé pour être transcrit, puis effacé.", "If the browser's dictation doesn't work: the audio is sent to be transcribed, then deleted."))}</div>
      <p style="margin:0">${L("Micro", "Microphone")} : <b>${micTxt}</b></p>
      <div class="row">${mic !== "granted" && mic !== "denied" ? `<button class="btn" id="micAsk">${L("Autoriser le micro", "Allow the microphone")}</button>` : ""}<button class="btn ghost" id="chatClear">${L("Effacer la conversation avec Gus", "Clear the conversation with Gus")}</button></div></section>
    <section class="card" id="sec-mail"><h2>${L("Envoi des justificatifs par e-mail", "Sending certificates by e-mail")}</h2>
      ${recipientForm("st")}
      ${sw("stAuto", (recipient() || {auto: true}).auto !== false, L("Ouvrir l'e-mail dès que le justificatif est signé", "Open the e-mail as soon as the certificate is signed"), L("Ta messagerie s'ouvre avec l'e-mail prêt : tu n'as plus qu'à appuyer sur Envoyer. Rien ne part sans toi.", "Your mail app opens with the e-mail ready: just press Send. Nothing goes out without you."))}
      <button class="btn" id="stSave">${L("Enregistrer", "Save")}</button></section>
    <section class="card"><h2>${L("Mon e-mail (facultatif)", "My e-mail (optional)")}</h2>
      <label class="field" for="em">${L("Affiché masqué sur tes justificatifs, si tu le choisis (ex. p•••@entreprise.fr)", "Shown masked on your certificates, if you choose (e.g. p•••@company.com)")}<input id="em" type="email" autocomplete="email" value="${esc(db.email())}"></label></section>
    <section class="card"><h2>${L("Clé de signature", "Signing key")}</h2>
      ${pk ? `<p style="margin:0">✓ ${pk.kind === "browser" ? L("Clé du navigateur (sans biométrie)", "Browser key (no biometrics)") : L("Clé sécurisée du téléphone (passkey)", "Phone's secure key (passkey)")}, ${L("créée le", "created on")} ${new Date(pk.created).toLocaleDateString(locale)}.</p>
        <button class="btn" id="resetKey">${L("Remplacer la clé", "Replace the key")}</button>` : `<p style="margin:0">${L("Pas encore de clé sur ce téléphone.", "No key on this phone yet.")}</p><button class="btn primary" id="mkKey">${L("Créer ma clé", "Create my key")}</button>`}
      <p class="muted small" style="margin:0">${L("Elle signe tes justificatifs. Elle ne quitte jamais ce téléphone. Les justificatifs déjà envoyés restent valables si tu la remplaces.", "It signs your certificates. It never leaves this phone. Certificates already sent stay valid if you replace it.")}</p></section>
    <section class="card"><h2>${L("Alertes du matin", "Morning alerts")}</h2><p class="muted small" style="margin:0">${L("Bientôt : une notification quand ton trajet habituel est perturbé, avec le plan B.", "Coming soon: a notification when your usual trip is disrupted, with the plan B.")}</p></section>
    <section class="card"><h2>${L("Confidentialité et conditions", "Privacy and terms")}</h2><p class="muted small" style="margin:0">${L("Aucun cookie. Tes trajets et justificatifs restent sur ce téléphone.", "No cookies. Your trips and certificates stay on this phone.")}</p>
      <div class="row"><a class="btn" href="confidentialite.html">${L("Confidentialité", "Privacy")}</a><a class="btn" href="conditions.html">${L("Conditions et mentions légales", "Terms and legal notice")}</a></div></section>
    <section class="card"><h2>${L("Mes données", "My data")}</h2><p class="muted small" style="margin:0">${L("Tout est gardé sur ce téléphone :", "Everything is kept on this phone:")} ${db.voyages().length} ${L("voyage(s)", "trip(s)")}, ${db.certs().length} ${L("justificatif(s)", "certificate(s)")}, ${favs.length} ${L("favori(s)", "favourite(s)")}.</p>
      <div class="row"><button class="btn" id="exp">${L("Exporter (fichier)", "Export (file)")}</button><button class="btn danger" id="wipe">${L("Tout effacer", "Erase everything")}</button></div></section>`;
  $("tAdd").onclick = () => { if (!tmp.a || !tmp.b) { toast(L("Choisis une gare de départ et d'arrivée dans la liste", "Pick a departure and an arrival station from the list")); return; } addTrip(tmp.a, tmp.b, !tl.length); toast(L("Trajet ajouté", "Trip added")); render(); };
  view.querySelectorAll("[data-tmain]").forEach(b => b.onclick = () => { const l = trips(); l.unshift(l.splice(+b.dataset.tmain, 1)[0]); saveTrips(l); selTrip = 0; toast(L("Trajet principal changé", "Main trip changed")); render(); });
  view.querySelectorAll("[data-tdel]").forEach(b => b.onclick = () => { const l = trips(); l.splice(+b.dataset.tdel, 1); saveTrips(l); render(); });
  if (anchor === "trajets") setTimeout(() => { const el = $("sec-trajets"); if (el) el.scrollIntoView({block: "start"}); }, 0);
  view.querySelectorAll("[data-lang]").forEach(b => b.onclick = () => { if (b.dataset.lang !== LPI.lang) LPI.setLang(b.dataset.lang); });
  $("posGeo").onclick = () => {
    if (!navigator.geolocation) { toast(L("Localisation indisponible", "Location unavailable")); return; }
    toast(L("Localisation…", "Locating…"));
    navigator.geolocation.getCurrentPosition(p => { raw.set("lp-pos", JSON.stringify({lat: p.coords.latitude, lon: p.coords.longitude, label: L("Ma position", "My location")})); toast(L("Position enregistrée", "Location saved")); render(); },
      () => toast(L("Localisation refusée", "Location refused")), {timeout: 10000});
  };
  if ($("posClear")) $("posClear").onclick = () => { raw.set("lp-pos", null); render(); };
  view.querySelectorAll("[data-unfav]").forEach(b => b.onclick = () => { favs.splice(+b.dataset.unfav, 1); raw.set("lp-favs", JSON.stringify(favs)); render(); });
  $("prof").onchange = () => { raw.set("lp-profile", $("prof").value); toast(L("Enregistré", "Saved")); };
  $("reg").onchange = () => { raw.set("lp-region", $("reg").value || null); toast(L("Enregistré", "Saved")); };
  $("bas").onchange = () => { raw.set("lp-base", $("bas").value); toast(L("Enregistré", "Saved")); };
  $("spk").onchange = () => { store.set("lp-speak", $("spk").checked); if (!$("spk").checked) { $("hf").checked = false; store.set("lp-handsfree", false); } };
  $("hf").onchange = () => { store.set("lp-handsfree", $("hf").checked); if ($("hf").checked) { $("spk").checked = true; store.set("lp-speak", true); } };
  $("srv").onchange = () => store.set("lp-stt", $("srv").checked ? "server" : null);
  if ($("micAsk")) $("micAsk").onclick = async () => {
    try { const st = await navigator.mediaDevices.getUserMedia({audio: true}); st.getTracks().forEach(t => t.stop()); toast(L("Micro autorisé", "Microphone allowed")); }
    catch (e) { toast(L("Micro refusé", "Microphone refused")); }
    render();
  };
  $("chatClear").onclick = () => { store.set("lp-chat", null); toast(L("Conversation effacée", "Conversation cleared")); };
  $("stSave").onclick = () => { const r = readRecipient("st"); if (!r) return; if (r.email) { store.set("lpa-recipient", {...r, auto: $("stAuto").checked}); toast(L("Destinataire enregistré", "Recipient saved")); } else toast(L("Destinataire effacé", "Recipient removed")); };
  $("stAuto").onchange = () => { const r = recipient(); if (r) store.set("lpa-recipient", {...r, auto: $("stAuto").checked}); };
  $("em").onchange = () => { store.set("lpa-email", $("em").value.trim()); toast(L("E-mail enregistré", "E-mail saved")); };
  if ($("mkKey")) $("mkKey").onclick = async () => { if (await ensureKey()) render(); };
  if ($("resetKey")) $("resetKey").onclick = async () => { if (!confirm(L("Créer une nouvelle clé ? L'ancienne ne servira plus pour les prochains justificatifs.", "Create a new key? The old one will no longer be used for future certificates."))) return; store.set("lp-passkey", null); if (await ensureKey()) render(); };
  $("exp").onclick = () => {
    const prefs = {}; ["lp-lang", "lp-profile", "lp-region", "lp-base", "lp-pos", "lp-favs", "lp-trajet", "lp-speak", "lp-handsfree", "lp-stt"].forEach(k => { const v = raw.get(k); if (v != null) prefs[k] = v; });
    const data = {exported: new Date().toISOString(), trips: trips(), voyages: db.voyages(), certs: db.certs(), email: db.email(), prefs};
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: "application/json"}));
    a.download = "lateproof-mes-donnees.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("wipe").onclick = async () => {
    if (!confirm(L("Effacer tous tes voyages, justificatifs, réglages, favoris et ta clé de ce téléphone ? Les liens déjà envoyés resteront vérifiables.", "Erase all your trips, certificates, settings, favourites and key from this phone? Links already sent stay verifiable."))) return;
    ["lpa-home", "lpa-voyages", "lpa-certs", "lpa-email", "lpa-hidden", "lpa-onboarded", "lp-passkey", "lpa-pending-group", "lpa-demo", "lpa-main", "lpa-recipient",
     "lp-profile", "lp-region", "lp-base", "lp-pos", "lp-favs", "lp-recent", "lp-trajet", "lp-speak", "lp-handsfree", "lp-stt", "lp-chat"].forEach(k => raw.set(k, null));
    try { await LP.idb.del("browser-key"); } catch (e) {}
    location.hash = "#/bienvenue";
  };
}, "profil");

// Correspondance : le prochain check-in rejoint le meme trajet
const _push = db.saveVoyages;
db.saveVoyages = v => {
  const g = store.get("lpa-pending-group");
  if (g && v.length && !v[v.length - 1].group && Date.now() / 1000 - v[v.length - 1].checkin < 60) { v[v.length - 1].group = g; store.set("lpa-pending-group", null); }
  _push(v);
};

render();
</script>
