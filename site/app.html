<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon espace · LateProof</title>
<meta name="description" content="Tes trajets, le retard en direct, ton justificatif de retard infalsifiable et tes droits, au même endroit.">
<meta name="theme-color" content="#121417">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D4FF3A'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%230B0C0F' stroke-width='10' stroke-linecap='round' pathLength='360' stroke-dasharray='120 360' transform='rotate(-90 32 32)'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%230B0C0F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#121417;--surface:#1A1D21;--surface2:#22262B;--surface3:#2B3036;--fg:#E6E6E0;--muted:#9DA2AA;--line:#2B3036;--lime:#D4FF3A;--orange:#FF8A5C;--blue:#D4FF3A;--on-blue:#121417;--amber:#FF8A5C;--amber-bg:#2A1C15;--mint:#D4FF3A;--red:#FF8A5C;--gold:#D4FF3A;--dot-ok:#D4FF3A;--dot-mid:#FFB547;--dot-bad:#FF8A5C;--soft:#22262B;--ok:#D4FF3A;--bad:#FF8A5C;--warn:#FF8A5C;--okfg:#D4FF3A;--display:"Manrope","Segoe UI",system-ui,sans-serif;--head:"Bricolage Grotesque","Manrope",sans-serif;--mono:"Manrope","Segoe UI",system-ui,sans-serif;color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--display);padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
.wrap{max-width:600px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:1.15rem;color:var(--fg);text-decoration:none}
.brand b{color:var(--blue)}
.nav{display:flex;gap:14px}.nav a{color:var(--muted);font-weight:600;text-decoration:none}.nav a:hover{color:var(--blue)}
h1{font-size:clamp(1.5rem,5vw,1.9rem);letter-spacing:-.02em;margin:6px 0 4px;line-height:1.15}
h2{font-size:1.05rem;margin:0}
.sub{color:var(--muted);margin:0 0 16px}
.stack{display:grid;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:grid;gap:10px;min-width:0}
.card p{margin:0}
.stack>*{min-width:0}
.card.hero{background:color-mix(in srgb,var(--blue) 7%,var(--surface))}
.kicker{font:700 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}.small{font-size:.84rem}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{display:flex;justify-content:space-between;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;font:700 .92rem var(--display);border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 16px;cursor:pointer;text-decoration:none}
.btn.primary{background:var(--blue);border-color:var(--blue);color:var(--on-blue)}
.btn.big{width:100%;min-height:56px;font-size:1.05rem;border-radius:14px}
.btn.ghost{background:none;border-color:transparent;color:var(--muted);min-height:36px;padding:6px 8px;justify-self:start}
.btn.danger{color:var(--red)}
.btn:disabled{opacity:.5;cursor:default}
.list{display:grid;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:center;text-align:left;width:100%;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:inherit;border-radius:12px;padding:11px 13px;cursor:pointer;text-decoration:none}
.item:hover{border-color:var(--blue)}
.item .t{font-weight:700;min-width:0;overflow-wrap:anywhere}
.item .s{grid-column:1;font-size:.82rem;color:var(--muted)}
.item .r{grid-row:1/3;grid-column:2;text-align:right}
.d{display:inline-block;font:700 .74rem var(--mono);padding:2px 6px;border-radius:5px;white-space:nowrap}
.d-ok{background:color-mix(in srgb,var(--mint) 16%,transparent);color:var(--mint)}
.d-mid{background:color-mix(in srgb,var(--amber) 18%,transparent);color:var(--amber)}
.d-bad{background:color-mix(in srgb,var(--red) 16%,transparent);color:var(--red)}
.big-num{display:flex;align-items:baseline;gap:10px}
.big-num b{font:700 2.6rem var(--mono);letter-spacing:-.02em;color:var(--red)}
.big-num b.ok{color:var(--mint)}
.field{display:grid;gap:5px;font-size:.84rem;font-weight:600;color:var(--muted)}
.field input,.field select{font:500 1rem var(--display);color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:11px 12px;width:100%}
.combo{position:relative}
.sugg{position:absolute;z-index:50;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 30px rgb(0 0 0/.16);max-height:300px;overflow:auto;padding:4px;margin:0;list-style:none}
.sugg li{padding:9px 10px;border-radius:8px;cursor:pointer;font-size:.95rem;display:flex;justify-content:space-between;gap:8px}
.sugg li:hover,.sugg li[aria-selected="true"]{background:var(--bg)}
.sugg .x{color:var(--muted);font-size:.8rem}
.steps{display:flex;gap:6px;font:700 .72rem var(--mono);color:var(--muted)}
.steps span{flex:1;border-top:3px solid var(--line);padding-top:6px}
.steps span.on{border-color:var(--blue);color:var(--fg)}
.tl{list-style:none;margin:0;padding:0;display:grid}
.tl li{display:grid;grid-template-columns:52px 14px 1fr auto;gap:0 8px;font-size:.9rem;align-items:start}
.tl .tm{font:600 .82rem var(--mono);text-align:right;padding-top:2px}
.tl .rail{position:relative;align-self:stretch}
.tl .rail::before{content:"";position:absolute;left:5px;top:0;bottom:0;width:3px;background:var(--line)}
.tl .rail::after{content:"";position:absolute;left:1px;top:6px;width:11px;height:11px;border-radius:50%;background:var(--surface);border:3px solid var(--muted);box-sizing:border-box}
.tl li.me .rail::after{border-color:var(--blue);background:var(--blue)}
.tl li.skip .nm{text-decoration:line-through;color:var(--muted)}
.tl .nm{padding:0 0 10px;min-width:0;overflow-wrap:anywhere}
.tl li button{border:0;background:none;font:inherit;color:inherit;text-align:left;padding:0;cursor:pointer}
.tl li button:hover .nm,.tl li.dest .nm{color:var(--blue);font-weight:700}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle .lbl{min-width:0}.toggle .lbl small{display:block;color:var(--muted);font-size:.8rem}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.switch span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.switch span::after{content:"";position:absolute;left:3px;top:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:transform .15s}
.switch input:checked+span{background:var(--blue)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:3px solid var(--blue);outline-offset:2px}
.level{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.level i{width:12px;height:12px;border-radius:50%;display:inline-block}
.lv-bronze i{background:#b06b2a}.lv-argent i{background:#9aa6b8}.lv-or i{background:#d4a514}
.notice{background:var(--amber-bg);border:1px solid color-mix(in srgb,var(--amber) 35%,transparent);border-radius:12px;padding:10px 14px;font-size:.88rem}
.msg{background:var(--surface2);border-radius:12px;padding:12px 14px;font-size:.92rem;white-space:pre-wrap;overflow-wrap:anywhere;max-height:9em;overflow:auto}
.empty{color:var(--muted);text-align:center;padding:26px 10px}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs nav{display:flex;width:100%;max-width:600px}
.tabs a{flex:1;display:grid;justify-items:center;gap:2px;padding:8px 4px 9px;color:var(--muted);text-decoration:none;font:600 .72rem var(--display)}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--blue)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:999px;font-weight:600;font-size:.88rem;z-index:100;max-width:calc(100% - 32px);text-align:center}
.spin{display:inline-block;width:16px;height:16px;border:2px solid var(--line);border-top-color:var(--blue);border-radius:50%;animation:sp 1s linear infinite;vertical-align:-3px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}}

/* ---- Direction artistique D : lime dominant, nuit, Unbounded + Manrope ---- */
h1,h2,h3{font-family:var(--head);letter-spacing:-.03em}
.wm{font:800 1.12rem var(--head);letter-spacing:-.045em;color:var(--fg)}
.brand{gap:9px}
body{font-variant-numeric:tabular-nums}
.btn,.btn.big{border-radius:999px}
.card{border-radius:22px}
.item{border-radius:18px}
.big-num b{font-family:var(--head);letter-spacing:-.05em}
.big-num b.ok{color:var(--lime)}
.d-ok{background:var(--lime);color:#0B0C0F}.d-mid,.d-bad{background:var(--orange);color:#0B0C0F}
.card.hero{background:var(--surface);border-color:var(--surface)}
.kicker{font-family:var(--display);font-weight:800}
.tabs{background:var(--bg);border-top:0;padding:0 12px calc(10px + env(safe-area-inset-bottom,0px))}
.tabs nav{background:var(--surface);border-radius:30px;padding:6px;gap:4px}
.tabs a{border-radius:24px;padding:8px 4px}
.tabs a[aria-current="page"]{background:var(--lime);color:#0B0C0F}
.tabs a svg{fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.switch input:checked+span::after{background:#0B0C0F}
.steps span.on{border-color:var(--lime)}

/* ---- Revision E : calme et relief. Gros titres gras et aplats lime seulement par touches. ---- */
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.015em}
.wm{font:700 1.15rem var(--head);letter-spacing:-.02em;color:var(--fg)}
.d-ok{background:rgb(212 255 58/.12);color:var(--lime)}.d-mid,.d-bad{background:rgb(255 138 92/.14);color:var(--orange)}
.card{border-color:transparent;box-shadow:inset 0 1px 0 rgb(255 255 255/.06)}
.card.hero{background:var(--surface2);box-shadow:inset 0 1px 0 rgb(255 255 255/.08),0 10px 24px rgb(0 0 0/.35)}
.item{border-color:transparent;background:var(--surface);box-shadow:inset 0 1px 0 rgb(255 255 255/.05)}.item:hover{background:var(--surface2);border-color:transparent}
.big-num b{font-family:var(--head);font-weight:700;letter-spacing:-.03em}
.btn{background:var(--surface2);border-color:transparent;box-shadow:inset 0 1px 0 rgb(255 255 255/.06)}
.btn.primary{background:var(--lime);color:#121417;box-shadow:none}
.btn.ghost{background:none;box-shadow:none}
.btn.danger{color:var(--orange)}
.tabs nav{box-shadow:inset 0 1px 0 rgb(255 255 255/.06)}
.tabs a[aria-current="page"]{background:var(--surface3);color:var(--lime)}
.field input,.field select{background:var(--surface);border-color:var(--surface3)}
.notice{background:var(--amber-bg);border-color:transparent}

/* ---- Gus dans l'accueil ---- */
.gus-intro{display:flex;align-items:flex-end;gap:12px;margin:6px 0 2px}
.gus-fig{flex:none;width:118px}
.gus-say{position:relative;margin:0 0 34px;padding:12px 14px;border-radius:18px 18px 18px 6px;background:var(--surface2);box-shadow:inset 0 1px 0 rgb(255 255 255/.08);font-size:.95rem;line-height:1.45}
@media (max-width:420px){.gus-fig{width:96px}.gus-fig .gus{width:96px;height:auto}}

/* ---- Ordinateur : menu à gauche, contenu en deux colonnes ---- */
@media (min-width:1024px){
  .wrap{max-width:1100px;display:grid;grid-template-columns:minmax(0,1fr);column-gap:44px;padding-bottom:40px}
  .wrap > .top{grid-column:1 / -1}
  .wrap > main{grid-column:1}
  .tabs{position:fixed;top:86px;bottom:auto;right:auto;left:max(16px,calc((100vw - 1180px) / 2 + 16px));width:220px;padding:0;background:none}
  .tabs nav{flex-direction:column;max-width:none;border-radius:24px;padding:8px}
  .tabs a{display:flex;align-items:center;gap:12px;padding:12px 16px;font-size:.95rem;border-radius:18px}
  #view{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start;padding-bottom:0}
  #view > :not(section), #view > section.hero, #view > section.stack{grid-column:1 / -1}
  #view > section[aria-labelledby="hT"], #view > section[aria-labelledby="pT"], #view > section:has(.toggle){grid-column:1 / -1}
  #vbody{grid-column:1 / -1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  #vbody > .hero, #vbody > .stack, #vbody > .notice, #vbody > .btn{grid-column:1 / -1}
  #view > .btn.big, #vbody .btn.big{max-width:420px}
  .gus-intro{max-width:760px}
}
</style>

<body data-app="app">
<div class="wrap">
  <header class="top">
    <a class="brand" href="#/"><svg width="30" height="30" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#D4FF3A"/><circle cx="32" cy="32" r="19" fill="none" stroke="#0B0C0F" stroke-opacity=".18" stroke-width="5"/><circle cx="32" cy="32" r="19" fill="none" stroke="#0B0C0F" stroke-width="5" stroke-linecap="round" pathLength="360" stroke-dasharray="120 360" transform="rotate(-90 32 32)"/><path d="M32 32L41.5 37.5" stroke="#0B0C0F" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="#0B0C0F"/></svg><span class="wm">lateproof</span></a>
    <nav class="nav"><a href="carte.html" data-en="Map">Carte</a><a href="assistant.html" data-en="Copilot">Copilote</a></nav>
  </header>
  <main id="view" class="stack" aria-live="polite"></main>
</div>


<script src="config.js"></script>
<script src="lp-i18n.js"></script>

<script>
"use strict";
const {rpc, store, fmt, esc, passkey} = LP;
const {L, locale} = LPI;
document.title = L("Mon espace · LateProof", "My space · LateProof");
const $ = id => document.getElementById(id);
const view = $("view");
const now = () => Math.floor(Date.now() / 1000);
const GL = ["OUI", "OGO", "IC", "ICN", "LYR", "ICE", "TGV", "ES"];
const MODES = {OUI: "TGV INOUI", OGO: "OUIGO", IC: "Intercités", ICN: L("Intercités de nuit", "Intercités night train"), LYR: "Lyria", ICE: "ICE", TT: "Tram-train", TER: "TER",
  RER: "RER", TRANSILIEN: "Transilien", METRO: L("Métro", "Metro"), TRAM: "Tram"};
const modeName = (m, line) => { const n = MODES[m] || m || "Train"; return line && !/^\d{3}[A-Z]$/.test(line) && n !== line ? `${n} ${line}` : n; };
function toast(t) { const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 2600); }
function badge(delay, cancelled) {
  if (cancelled) return `<span class="d d-bad">${L("supprimé", "cancelled")}</span>`;
  const m = fmt.min(delay);
  if (m < 1) return `<span class="d d-ok">${L("à l'heure", "on time")}</span>`;
  return `<span class="d ${m >= 15 ? "d-bad" : m >= 5 ? "d-mid" : "d-ok"}">+${m} min</span>`;
}
const spinner = txt => `<p class="muted"><span class="spin" aria-hidden="true"></span> ${esc(txt || L("Chargement…", "Loading…"))}</p>`;

// ================================================================= Donnees locales (restent sur l'appareil)
const db = {
  home: () => store.get("lpa-home"),                     // {a, b} : trajet habituel (gares)
  voyages: () => store.get("lpa-voyages", []),           // check-ins
  certs: () => store.get("lpa-certs", []),               // justificatifs crees
  email: () => store.get("lpa-email", ""),
  saveVoyages: v => store.set("lpa-voyages", v),
  saveCerts: v => store.set("lpa-certs", v),
};
const voyageById = id => db.voyages().find(v => v.id === id);
function updateVoyage(id, patch) { const all = db.voyages(); const i = all.findIndex(v => v.id === id); if (i >= 0) { all[i] = {...all[i], ...patch}; db.saveVoyages(all); return all[i]; } }
const uid = () => LP.hex(crypto.getRandomValues(new Uint8Array(6)));

// ================================================================= Recherche de gare (champ reutilisable)
function stationField(id, label, value, onPick, placeholder) {
  setTimeout(() => {
    const input = $(id), list = $(id + "L"); if (!input) return;
    let opts = [], t = null;
    const close = () => { list.hidden = true; input.setAttribute("aria-expanded", "false"); };
    const show = () => {
      if (!opts.length) return close();
      list.innerHTML = opts.map((o, i) => `<li role="option" data-i="${i}"><span>${esc(o.name)}</span><span class="x">${o.net === "idf" ? "Île-de-France" : "SNCF"}</span></li>`).join("");
      list.hidden = false; input.setAttribute("aria-expanded", "true");
    };
    input.addEventListener("input", () => {
      clearTimeout(t); const q = input.value.trim(); if (q.length < 2) { opts = []; return close(); }
      t = setTimeout(() => rpc("public_find_stop", {p_q: q}).then(r => { if (input.value.trim() === q) { opts = r || []; show(); } }).catch(() => {}), 220);
    });
    input.addEventListener("keydown", e => { if (e.key === "Enter" && opts[0] && !list.hidden) { e.preventDefault(); pick(0); } if (e.key === "Escape") close(); });
    const pick = i => { const o = opts[i]; input.value = o.name; close(); onPick({net: o.net, id: o.id, name: o.name, lat: +o.lat, lon: +o.lon}); };
    list.addEventListener("mousedown", e => { const li = e.target.closest("li"); if (li) { e.preventDefault(); pick(+li.dataset.i); } });
    input.addEventListener("blur", () => setTimeout(close, 150));
  });
  return `<label class="field" for="${id}">${esc(label)}<div class="combo"><input id="${id}" type="search" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="${id}L" placeholder="${esc(placeholder || L("Nom de la gare", "Station name"))}" value="${esc(value || "")}"><ul class="sugg" id="${id}L" role="listbox" hidden></ul></div></label>`;
}

// ================================================================= Routeur
const routes = [];
const route = (re, fn, tab) => routes.push({re, fn, tab});
async function render() {
  const h = location.hash.replace(/^#/, "") || "/";
  if (!store.get("lpa-onboarded") && h === "/") { location.replace("#/bienvenue"); return; }
  for (const r of routes) {
    const m = h.match(r.re);
    if (m) {
      document.querySelectorAll(".lpt a[data-tab]").forEach(a => { if (a.dataset.tab === r.tab) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
      window.scrollTo(0, 0);
      await r.fn(...m.slice(1));
      return;
    }
  }
  location.replace("#/");
}
window.addEventListener("hashchange", render);

// ================================================================= Bienvenue (premiere visite)
route(/^\/bienvenue$/, () => {
  let step = 0; const tmp = {a: null, b: null};
  const draw = () => {
    const dots = `<div class="steps" aria-hidden="true">${[0, 1, 2].map(i => `<span class="${i <= step ? "on" : ""}">${i + 1}</span>`).join("")}</div>`;
    const GUS = [["salut", "content", L("Salut, moi c'est Gus ! Je surveille tes trains et je composte la preuve quand ils sont en retard.", "Hi, I'm Gus! I watch your trains and stamp the proof when they run late.")],
      ["billet", "neutre", L("Dis-moi quel train tu prends : je le surveille chaque matin pour toi.", "Tell me which train you take: I'll watch it for you every morning.")],
      ["repos", "content", L("Ta clé signe tes justificatifs. Même moi, je ne peux pas en faire à ta place.", "Your key signs your certificates. Not even I can make one for you.")]][step];
    const gusIntro = `<div class="gus-intro"><div class="gus-fig">${Gus.svg({pose: GUS[0], mood: GUS[1], size: 118})}</div><p class="gus-say">${GUS[2]}</p></div>`;
    if (step === 0) view.innerHTML = dots + gusIntro + L(`<h1>Bienvenue sur LateProof</h1>
      <div class="card"><p><b>Ton copilote quand le train déraille.</b> Le retard de ton trajet en direct, un plan B, et quand tu arrives en retard, un <b>justificatif infalsifiable</b> que ton employeur ou ton prof vérifie en 3 secondes, sans rien installer.</p>
      <p class="muted small">Tes trajets, tes justificatifs et ta clé restent sur ce téléphone. Tu décides seul de ce que tu montres, et à qui.</p></div>

      : `<p class="muted" style="margin:0">${L("Aucun train trouvé dans les 3 prochaines heures (trains, RER, Transilien).", "No train found in the next 3 hours (trains, RER, Transilien).")}</p>`;

const cap = s => s.charAt(0).toUpperCase() + s.slice(1);
const spinnerInline = () => `<span class="spin" aria-label="${L("Chargement", "Loading")}"></span>`;
function best(js) {   // partir plus tard ET arriver plus tot : on ne garde que les meilleures options
  const rt = (t, d) => t + Math.max(d || 0, 0), dep = j => rt(j.legs[0].dep, j.legs[0].dep_delay), arr = j => rt(j.arr, j.arr_delay);
  const s = [...js].sort((a, b) => dep(a) - dep(b)); const out = []; let b = Infinity;
  for (let i = s.length - 1; i >= 0; i--) if (arr(s[i]) < b) { out.unshift(s[i]); b = arr(s[i]); }
  return out;
}
async function refreshRunning(v) {
  try {
    const t = await trainOf(v); const el = $("runSt"); if (!el) return;
    const st = (v.to && t.stops.find(s => s.stop === v.to.stop)) || t.stops[t.stops.length - 1];
    el.innerHTML = st ? badge(st.arr_delay ?? st.dep_delay, st.skipped) : "";
  } catch (e) { const el = $("runSt"); if (el) el.textContent = ""; }
}

const trainCache = new Map();
async function trainOf(v) {
  const k = `${v.net}|${v.num}|${v.day}`;
  if (trainCache.has(k) && Date.now() - trainCache.get(k).at < 60000) return trainCache.get(k).t;
  const t = await rpc("public_journey_train", {p_net: v.net, p_num: v.num, p_day: v.day});
  if (!t) throw new Error("introuvable");
  trainCache.set(k, {t, at: Date.now()}); return t;
}

    ${rightsHtml(legs, trip)}
    <div class="stack">
      ${trip.delay >= 60 || trip.cancelled ? `<a class="btn primary big" href="#/nouveau/${v.id}">${L("Créer mon justificatif de retard", "Create my delay certificate")}</a>` : `<p class="muted small">${L("Pas de retard pour l'instant : rien à justifier. Le retard se met à jour en direct.", "No delay so far: nothing to prove. The delay updates live.")}</p>`}
      <a class="btn" href="#/checkin" id="addLeg">${L("+ J'ai pris une correspondance", "+ I took a connection")}</a>
      <button class="btn danger" id="del">${L("Supprimer ce voyage", "Delete this trip")}</button>
    </div>`;
  $("vbody").querySelectorAll("[data-to]").forEach(b => b.onclick = () => { const s = after.find(x => x.stop === b.dataset.to); updateVoyage(v.id, {to: {stop: s.stop, name: s.name}}); render(); });
  $("addLeg").onclick = () => { const g = v.group || v.id; legs.forEach(x => updateVoyage(x.id, {group: g})); store.set("lpa-pending-group", g); };
  const pl = $("planned"); if (pl) pl.onchange = () => { const [h, m] = pl.value.split(":").map(Number); legs.forEach(x => updateVoyage(x.id, {plannedHM: pl.value ? [h, m] : null})); render(); };
  $("del").onclick = () => delVoyage(v);
}, "voyages");
// Horaires du train + gare d'arrivee (choisie, ou trajet habituel s'il est sur la ligne, ou terminus) -> retard a l'arrivee
async function resolveLeg(v) {
  const t = await trainOf(v);
  const i0 = Math.max(0, t.stops.findIndex(s => s.stop === v.from.id || norm(s.name) === norm(v.from.name)));
  const after = t.stops.slice(i0);
  let to = v.to;
  if (!to) {
    const home = db.home(), hb = home && after.slice(1).find(s => norm(s.name) === norm(home.b.name));
    const s = hb || after[after.length - 1]; if (s) to = {stop: s.stop, name: s.name};
  }
  const toStop = to && after.find(s => s.stop === to.stop);
  if (toStop) updateVoyage(v.id, {to, result: {delay: toStop.arr_delay ?? toStop.dep_delay ?? 0,
    cancelled: !!toStop.skipped || t.status === "CANCELED" || t.status === "CANCELLED", sched_arr: toStop.sched_arr || toStop.sched_dep, rec: toStop.rec || null}});
  return {t, after, to, toStop};
}
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, " ").trim();
function delVoyage(v) { if (!confirm(L("Supprimer ce voyage de ce téléphone ?", "Delete this trip from this phone?"))) return; db.saveVoyages(db.voyages().filter(x => x.id !== v.id)); location.hash = "#/voyages"; }

// Retard du trajet complet : heure d'arrivee reelle - heure d'arrivee prevue (pas une simple addition).
// Par defaut, l'arrivee prevue = horaire du dernier train pris ; si une correspondance a ete ratee, la personne indique
// l'heure a laquelle elle aurait du arriver (marquee « declaree »).
function tripTotal(legs) {
  const last = legs[legs.length - 1], r = last.result || {};
  const real = r.sched_arr ? r.sched_arr + Math.max(r.delay || 0, 0) : null;
  let planned = r.sched_arr || null, declared = false, plannedInput = "";
  if (last.plannedHM && real) {
    const d = new Date(real * 1000), p = new Date(d.toLocaleString("en-US", {timeZone: "Europe/Paris"}));
    const off = d.getTime() - p.getTime(); p.setHours(last.plannedHM[0], last.plannedHM[1], 0, 0);
    planned = Math.floor((p.getTime() + off) / 1000); declared = true; plannedInput = `${String(last.plannedHM[0]).padStart(2, "0")}:${String(last.plannedHM[1]).padStart(2, "0")}`;
  }
  const delay = real && planned ? Math.max(0, real - planned) : (r.delay || 0);
  const rows = legs.map((l, i) => {
    const rr = l.result || {};
    const prev = i > 0 ? legs[i - 1].result : null;
    const wait = prev && prev.sched_arr ? l.sched - (prev.sched_arr + Math.max(prev.delay || 0, 0)) : null;
    return {label: `${esc(modeName(l.mode, l.line))} n° ${esc(l.num)} · ${esc(l.from.name)} → ${esc(l.to ? l.to.name : "?")}${wait != null ? ` <span class="muted">(${L("attente", "wait")} ${Math.max(0, fmt.min(wait))} min)</span>` : ""}`,
            badge: badge(rr.delay, rr.cancelled)};
  });
  return {delay, real, planned, declared, plannedInput, cancelled: !!r.cancelled, rows};
}

// ================================================================= Droits
function rightsHtml(legs, trip) {
  const min = fmt.min(trip.delay), modes = legs.map(l => l.mode), out = [];
  const gl = modes.some(m => GL.includes(m)), ter = modes.some(m => m === "TER" || m === "TT"), idf = legs.some(l => l.net === "idf" && l.mode !== "TER");
  if (gl && min >= 30) out.push(L(`<b>Garantie G30</b> (TGV INOUI, Intercités) : compensation possible dès 30 min de retard. À demander en ligne dans ton espace SNCF Connect, dans un délai limité.`, `<b>G30 guarantee</b> (TGV INOUI, Intercités): compensation possible from 30 min late. Claim it online in your SNCF Connect account, within a limited time.`));
  if ((gl || ter) && min >= 60) out.push(L(`<b>Règlement européen 2021/782</b> : ${min >= 120 ? "50 %" : "25 %"} du prix du billet pour ${min >= 120 ? "2 h" : "1 h"} de retard ou plus à l'arrivée.`, `<b>EU regulation 2021/782</b>: ${min >= 120 ? "50%" : "25%"} of the ticket price for ${min >= 120 ? "2 h" : "1 h"} late or more on arrival.`));
  if (idf) out.push(L(`<b>Île-de-France (Navigo)</b> : pas d'indemnisation trajet par trajet ; des dédommagements des abonnés sont parfois annoncés par Île-de-France Mobilités après de fortes perturbations.`, `<b>Paris region (Navigo)</b>: no compensation per trip; Île-de-France Mobilités sometimes announces refunds for pass holders after major disruptions.`));
  if (min >= 5) out.push(L(`<b>Au travail ou en cours</b> : ton justificatif LateProof prouve le retard et ta présence dans le train. Un retard justifié dû aux transports ne devrait pas être sanctionné.`, `<b>At work or school</b>: your LateProof certificate proves the delay and that you were on the train. In France, a justified transport delay should not be sanctioned.`));
  if (!out.length) return "";
  const claim = legs.map(l => `${modeName(l.mode, l.line)} n° ${l.num} du ${l.day.slice(6, 8)}/${l.day.slice(4, 6)}/${l.day.slice(0, 4)}, ${l.from.name} → ${l.to ? l.to.name : "?"}${l.result ? `, retard à l'arrivée ${fmt.min(l.result.delay)} min` : ""}`).join("\n");
  setTimeout(() => { const b = $("copyClaim"); if (b) b.onclick = () => navigator.clipboard.writeText(claim).then(() => toast(L("Informations copiées", "Details copied")), () => toast(L("Copie impossible", "Copy failed"))); });
  return `<section class="card"><h2>${L("Tes droits", "Your rights")}</h2>${out.map(x => `<p class="small" style="margin:0">${x}</p>`).join("")}
    <p class="muted small" style="margin:0">${L("Résumé général, à vérifier sur le site de l'opérateur.", "General summary, check with the operator.")}</p>
    ${gl || ter ? `<button class="btn" id="copyClaim">${L("Copier les infos pour ma demande", "Copy the details for my claim")}</button>` : ""}</section>`;
}

// ================================================================= Nouveau justificatif
const FIELD_INFO = L({
  date: ["Date du trajet", "Toujours visible"], trains: ["Trains et lignes", ""], arrivee: ["Gare d'arrivée", ""], depart: ["Gare de départ", "Cachée par défaut : elle peut révéler où tu habites"],
  etapes: ["Détail étape par étape", "Retard de chaque train, attente en correspondance"], checkin: ["Heure du check-in", ""], presence: ["Niveau de présence", ""],
  titulaire: ["Titulaire (e-mail masqué)", "Ex. p•••@entreprise.fr"], releves: ["Relevés officiels du retard", "Pour la preuve publique sur Solana"],
}, {
  date: ["Trip date", "Always shown"], trains: ["Trains and lines", ""], arrivee: ["Arrival station", ""], depart: ["Departure station", "Hidden by default: it can reveal where you live"],
  etapes: ["Leg by leg", "Each train's delay, connection wait"], checkin: ["Check-in time", ""], presence: ["Presence level", ""],
  titulaire: ["Holder (masked e-mail)", "e.g. p•••@company.com"], releves: ["Official delay records", "For the public proof on Solana"],
});
route(/^\/nouveau\/(\w+)$/, id => {
  const v = voyageById(id); if (!v || !v.result) { location.replace("#/voyage/" + id); return; }
  const legs = legsOf(v), trip = tripTotal(legs), first = legs[0], last = legs[legs.length - 1];
  const email = db.email();
  const mask = e => { const [u, d] = String(e).split("@"); return d ? `${u.slice(0, 1)}•••@${d}` : ""; };
  const fields = [
    {n: "date", v: `${first.day.slice(0, 4)}-${first.day.slice(4, 6)}-${first.day.slice(6, 8)}`},
    {n: "retard_min", v: String(fmt.min(trip.delay))},
    {n: "arrivee_prevue", v: String(trip.planned || "")}, {n: "arrivee_reelle", v: String(trip.real || "")},
    {n: "trains", v: legs.map(l => `${modeName(l.mode, l.line)} n° ${l.num}`).join(" › ")},
    {n: "arrivee", v: last.to ? last.to.name : ""},
    {n: "depart", v: first.from.name},
    {n: "etapes", v: JSON.stringify(legs.map(l => ({t: `${modeName(l.mode, l.line)} n° ${l.num}`, a: l.to ? l.to.name : "", dp: l.sched, ap: l.result.sched_arr, r: l.result.delay, x: !!l.result.cancelled})))},
    {n: "checkin", v: String(first.checkin)},
    {n: "presence", v: presenceLevel(first).name + " : " + presenceLevel(first).txt},
    ...(email ? [{n: "titulaire", v: mask(email)}] : []),
    {n: "releves", v: JSON.stringify(legs.map(l => l.result.rec).filter(Boolean))},
    {n: "declare", v: trip.declared ? "heure d'arrivée prévue déclarée" : "non"},
  ];
  const hidden = new Set(store.get("lpa-hidden", ["depart"]));
  const optional = ["trains", "arrivee", "depart", "etapes", "checkin", "presence", ...(email ? ["titulaire"] : []), "releves"];
  view.innerHTML = `<button class="btn ghost" onclick="history.back()">${L("← Retour", "← Back")}</button>
    <h1>${L("Mon justificatif", "My certificate")}</h1><p class="sub">${L("Choisis ce que tu montres. Ce que tu caches reste scellé : personne ne peut le lire, mais le justificatif reste vérifiable.", "Choose what you show. What you hide stays sealed: nobody can read it, but the certificate can still be checked.")}</p>
    <section class="card hero"><div class="big-num"><b>+${fmt.min(trip.delay)}</b><span>min${legs.length > 1 ? L(" au total", " in total") : ""}</span></div>
      <span class="muted small">${esc(dayLabel(first.day))} · ${esc(fields[4].v)}</span></section>
    <section class="card"><h2>${L("Ce que verra ton employeur ou ton prof", "What your employer or teacher will see")}</h2>
      ${optional.map(n => `<div class="toggle"><span class="lbl">${esc(FIELD_INFO[n][0])}<small>${esc(FIELD_INFO[n][1])}</small></span>
        <label class="switch"><input type="checkbox" data-f="${n}" ${hidden.has(n) ? "" : "checked"} aria-label="${L("Montrer :", "Show:")} ${esc(FIELD_INFO[n][0])}"><span></span></label></div>`).join("")}
      ${email ? "" : L(`<p class="muted small" style="margin:0">Pour ajouter ton e-mail masqué (il rassure l'employeur que c'est bien toi), renseigne-le dans <a href="#/profil">Profil</a>.</p>`, `<p class="muted small" style="margin:0">To add your masked e-mail (it reassures your employer it's really you), enter it in <a href="#/profil">Profile</a>.</p>`)}
    </section>
    <button class="btn primary big" id="sign">${L("Signer avec mon téléphone", "Sign with my phone")}</button>
    <p class="muted small">${L("Le justificatif est scellé maintenant : impossible de le modifier ensuite sans que ça se voie.", "The certificate is sealed now: it cannot be changed later without it showing.")}</p>`;
  view.querySelectorAll("[data-f]").forEach(c => c.onchange = () => { c.checked ? hidden.delete(c.dataset.f) : hidden.add(c.dataset.f); store.set("lpa-hidden", [...hidden]); });
  $("sign").onclick = async () => {
    const key = await ensureKey(); if (!key) return;
    $("sign").disabled = true; $("sign").innerHTML = `<span class="spin" aria-hidden="true"></span> ${L("Signature…", "Signing…")}`;
    try {
      const cert = await LP.buildCert(fields, [...hidden]);
      const url = new URL("verif.html", location.href).href + "#c=" + LP.certToHash(cert);
      const code = LP.shortCode(cert.root);
      const all = db.certs(); all.unshift({id: uid(), voyage: v.id, code, url, created: cert.at, delay: trip.delay, day: first.day, label: fields[4].v, to: last.to ? last.to.name : ""});
      db.saveCerts(all.slice(0, 100));
      location.hash = "#/justificatif/" + all[0].id;
    } catch (e) {
      $("sign").disabled = false; $("sign").textContent = L("Signer avec mon téléphone", "Sign with my phone");
      toast(e && e.name === "NotAllowedError" ? L("Signature annulée", "Signing cancelled") : L("Signature impossible : ", "Signing failed: ") + (e.message || e));
    }
  };
}, "voyages");

// ================================================================= Justificatifs
route(/^\/justificatifs$/, () => {
  const all = db.certs();
  view.innerHTML = `<h1>${L("Mes justificatifs", "My certificates")}</h1><p class="sub">${L("Chacun se vérifie avec son lien, sans compte ni appli.", "Each one is checked with its link, no account or app needed.")}</p>` +
    (all.length ? `<div class="list">${all.map(c => `<a class="item" href="#/justificatif/${c.id}"><span class="t">+${fmt.min(c.delay)} min · ${esc(c.label)}</span><span class="r"><span class="d d-ok">${esc(c.code)}</span></span>
      <span class="s">${esc(dayLabel(c.day))}${c.to ? " · " + esc(c.to) : ""}</span></a>`).join("")}</div>`
      : L(`<div class="empty">Pas encore de justificatif. Après un trajet en retard, ouvre-le dans <a href="#/voyages">Voyages</a>.</div>`, `<div class="empty">No certificate yet. After a late trip, open it in <a href="#/voyages">Trips</a>.</div>`));
}, "certs");
route(/^\/justificatif\/(\w+)$/, id => {
  const c = db.certs().find(x => x.id === id); if (!c) { location.replace("#/justificatifs"); return; }
  const text = L(`Bonjour, mon trajet du ${c.day.slice(6, 8)}/${c.day.slice(4, 6)} a eu ${fmt.min(c.delay)} min de retard (${c.label}). Justificatif vérifiable : ${c.url}`, `Hello, my trip on ${c.day.slice(6, 8)}/${c.day.slice(4, 6)} was ${fmt.min(c.delay)} min late (${c.label}). Verifiable certificate: ${c.url}`);
  view.innerHTML = `<button class="btn ghost" onclick="location.hash='#/justificatifs'">${L("← Mes justificatifs", "← My certificates")}</button>
    <h1>${L("Justificatif prêt", "Certificate ready")}</h1>
    <section class="card hero"><div class="big-num"><b>+${fmt.min(c.delay)}</b><span>${L("min de retard", "min late")}</span></div>
      <span class="muted small">${esc(dayLabel(c.day))} · ${esc(c.label)} · ${L("code", "code")} <b>${esc(c.code)}</b></span></section>
    <section class="card"><h2>${L("Le message à envoyer", "The message to send")}</h2><div class="msg">${esc(text)}</div>
      <div class="row"><button class="btn primary" id="share">${L("Envoyer", "Send")}</button><button class="btn" id="copy">${L("Copier le message", "Copy the message")}</button><button class="btn" id="copyUrl">${L("Copier le lien", "Copy the link")}</button></div></section>
    <a class="btn big" href="${esc(c.url)}" target="_blank" rel="noopener">${L("Voir ce que verra la personne", "See what they will see")}</a>
    <p class="muted small">${L("Le lien contient tout le justificatif : rien n'est stocké sur un serveur. Il reste vérifiable même si tu supprimes l'appli.", "The link contains the whole certificate: nothing is stored on a server. It stays verifiable even if you delete the app.")}</p>
    <button class="btn danger" id="del">${L("Supprimer de ce téléphone", "Delete from this phone")}</button>`;
  $("share").onclick = async () => { try { if (navigator.share) { await navigator.share({title: L("Justificatif de retard", "Delay certificate"), text}); return; } } catch (e) { return; } $("copy").click(); };
  $("copy").onclick = () => navigator.clipboard.writeText(text).then(() => toast(L("Message copié", "Message copied")), () => toast(L("Copie impossible", "Copy failed")));
  $("copyUrl").onclick = () => navigator.clipboard.writeText(c.url).then(() => toast(L("Lien copié", "Link copied")), () => toast(L("Copie impossible", "Copy failed")));
  $("del").onclick = () => { if (!confirm(L("Supprimer ce justificatif de ce téléphone ? Le lien déjà envoyé restera vérifiable.", "Delete this certificate from this phone? A link already sent stays verifiable."))) return; db.saveCerts(db.certs().filter(x => x.id !== c.id)); location.hash = "#/justificatifs"; };
}, "certs");

// ================================================================= Profil
route(/^\/profil$/, () => {
  const home = db.home() || {}, pk = passkey.get(), tmp = {...home};
  view.innerHTML = `<h1>${L("Profil", "Profile")}</h1>
    <section class="card"><h2>${L("Mon trajet habituel", "My usual trip")}</h2>
      ${stationField("pa", L("Départ", "From"), home.a && home.a.name, s => { tmp.a = s; saveHome(); })}
      ${stationField("pb", L("Arrivée", "To"), home.b && home.b.name, s => { tmp.b = s; saveHome(); })}</section>
    <section class="card"><h2>${L("Mon e-mail (facultatif)", "My e-mail (optional)")}</h2>
      <label class="field" for="em">${L("Affiché masqué sur tes justificatifs, si tu le choisis (ex. p•••@entreprise.fr)", "Shown masked on your certificates, if you choose (e.g. p•••@company.com)")}<input id="em" type="email" autocomplete="email" value="${esc(db.email())}"></label></section>
    <section class="card"><h2>${L("Clé de signature", "Signing key")}</h2>
      ${pk ? `<p style="margin:0">✓ ${pk.kind === "browser" ? L("Clé du navigateur (sans biométrie)", "Browser key (no biometrics)") : L("Clé sécurisée du téléphone (passkey)", "Phone's secure key (passkey)")}, ${L("créée le", "created on")} ${new Date(pk.created).toLocaleDateString(locale)}.</p>
        <button class="btn" id="resetKey">${L("Remplacer la clé", "Replace the key")}</button>` : `<p style="margin:0">${L("Pas encore de clé sur ce téléphone.", "No key on this phone yet.")}</p><button class="btn primary" id="mkKey">${L("Créer ma clé", "Create my key")}</button>`}
      <p class="muted small" style="margin:0">${L("Elle signe tes justificatifs. Elle ne quitte jamais ce téléphone. Les justificatifs déjà envoyés restent valables si tu la remplaces.", "It signs your certificates. It never leaves this phone. Certificates already sent stay valid if you replace it.")}</p></section>
    <section class="card"><h2>${L("Position et favoris", "Location and favourites")}</h2><p class="muted small" style="margin:0">${L("Ta position, tes gares et tes trajets favoris se gèrent sur la carte.", "Your location, favourite stations and trips are managed on the map.")}</p><a class="btn" href="carte.html">${L("Ouvrir la carte", "Open the map")}</a></section>
    <section class="card"><h2>${L("Alertes du matin", "Morning alerts")}</h2><p class="muted small" style="margin:0">${L("Bientôt : une notification quand ton trajet habituel est perturbé, avec le plan B.", "Coming soon: a notification when your usual trip is disrupted, with the plan B.")}</p></section>
    <section class="card"><h2>${L("Mes données", "My data")}</h2><p class="muted small" style="margin:0">${L("Tout est gardé sur ce téléphone :", "Everything is kept on this phone:")} ${db.voyages().length} ${L("voyage(s)", "trip(s)")}, ${db.certs().length} ${L("justificatif(s)", "certificate(s)")}.</p>
      <div class="row"><button class="btn" id="exp">${L("Exporter (fichier)", "Export (file)")}</button><button class="btn danger" id="wipe">${L("Tout effacer", "Erase everything")}</button></div></section>`;
  function saveHome() { if (tmp.a && tmp.b) { store.set("lpa-home", {a: tmp.a, b: tmp.b}); toast(L("Trajet habituel enregistré", "Usual trip saved")); } }
  $("em").onchange = () => { store.set("lpa-email", $("em").value.trim()); toast(L("E-mail enregistré", "E-mail saved")); };
  if ($("mkKey")) $("mkKey").onclick = async () => { if (await ensureKey()) render(); };
  if ($("resetKey")) $("resetKey").onclick = async () => { if (!confirm(L("Créer une nouvelle clé ? L'ancienne ne servira plus pour les prochains justificatifs.", "Create a new key? The old one will no longer be used for future certificates."))) return; store.set("lp-passkey", null); if (await ensureKey()) render(); };
  $("exp").onclick = () => {
    const data = {exported: new Date().toISOString(), home: db.home(), voyages: db.voyages(), certs: db.certs(), email: db.email()};
    const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(data, null, 2)], {type: "application/json"}));
    a.download = "lateproof-mes-donnees.json"; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  };
  $("wipe").onclick = async () => {
    if (!confirm(L("Effacer tous tes voyages, justificatifs, ton trajet et ta clé de ce téléphone ? Les liens déjà envoyés resteront vérifiables.", "Erase all your trips, certificates, usual trip and key from this phone? Links already sent stay verifiable."))) return;
    ["lpa-home", "lpa-voyages", "lpa-certs", "lpa-email", "lpa-hidden", "lpa-onboarded", "lp-passkey", "lpa-pending-group"].forEach(k => store.set(k, null));
    try { await LP.idb.del("browser-key"); } catch (e) {}
    location.hash = "#/bienvenue";
  };
}, "profil");

// Correspondance : le prochain check-in rejoint le meme trajet
const _push = db.saveVoyages;
db.saveVoyages = v => {
  const g = store.get("lpa-pending-group");
  if (g && v.length && !v[v.length - 1].group && Date.now() / 1000 - v[v.length - 1].checkin < 60) { v[v.length - 1].group = g; store.set("lpa-pending-group", null); }
  _push(v);
};

render();
</script>
</body>
</html>
