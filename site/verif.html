<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Vérification du justificatif · LateProof</title>
<meta name="description" content="Justificatif de retard de train vérifiable : authentique, signé par le téléphone de son titulaire, impossible à modifier.">
<meta property="og:title" content="Justificatif de retard vérifiable · LateProof">
<meta property="og:description" content="Ouvre le lien pour vérifier le retard en 3 secondes, sans rien installer.">
<meta name="theme-color" content="#F2F1EC">
<meta name="referrer" content="no-referrer">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23D4FF3A'/%3E%3Ccircle cx='32' cy='32' r='18' fill='none' stroke='%230B0C0F' stroke-width='10' stroke-linecap='round' pathLength='360' stroke-dasharray='120 360' transform='rotate(-90 32 32)'/%3E%3Ccircle cx='32' cy='32' r='7' fill='%230B0C0F'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
:root{--bg:#F2F1EC;--surface:#FFFFFF;--surface2:#F2F1EC;--surface3:#E6E5DF;--fg:#121417;--muted:#5C6068;--line:#E6E5DF;--lime:#D4FF3A;--orange:#C2410C;--blue:#121417;--on-blue:#FFFFFF;--soft:#FFFFFF;--ok:#3E6B00;--okfg:#3E6B00;--bad:#C2410C;--warn:#C2410C;--display:"Manrope","Segoe UI",system-ui,sans-serif;--head:"Bricolage Grotesque","Manrope",sans-serif;--mono:"Manrope","Segoe UI",system-ui,sans-serif;color-scheme:light}
*{box-sizing:border-box}[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 var(--display)}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:6px}
a{color:var(--blue)}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px;background:var(--surface);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:1.05rem;color:var(--fg);text-decoration:none}.brand b{color:var(--blue)}
.code{font:600 .8rem var(--mono);color:var(--muted)}
.banner{color:#0B0C0F;padding:22px 16px 20px}
.banner .in{max-width:560px;margin:0 auto;display:grid;gap:6px}
.banner h1{display:flex;align-items:center;gap:10px;margin:0;font-size:1.55rem;letter-spacing:-.01em}
.banner p{margin:0;opacity:.95;font-size:.95rem}
.ok{background:#D4FF3A;color:#0B0C0F}.bad{background:#FF6A3D;color:#0B0C0F}.wait{background:#2A2D33;color:#F4F5F0}   /* texte blanc : contraste AA dans les deux themes */
main{max-width:560px;margin:0 auto;padding:18px 16px 40px;display:grid;gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:10px}
.kicker{font:700 .7rem var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted)}
.big{display:flex;align-items:baseline;gap:10px}.big b{font:700 2.75rem var(--mono);color:var(--bad);letter-spacing:-.02em}
.leg{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:9px 0;border-top:1px solid var(--line)}
.leg .t{font-weight:600}.leg .s{font-size:.82rem;color:var(--muted)}.leg .r{grid-row:1/3;grid-column:2;font:700 .9rem var(--mono);color:var(--bad);align-self:center}
.leg .r.okc{color:var(--ok)}
.total{display:flex;justify-content:space-between;border-top:2px solid var(--fg);padding-top:10px;font-weight:800}
.check{display:flex;gap:10px;align-items:flex-start;font-size:.93rem}.check i{font-style:normal;font-weight:800;color:var(--okfg,var(--ok))}.check i.w{color:var(--warn)}.check i.x{color:var(--bad)}
details{background:var(--surface);border:1px solid var(--line);border-radius:12px}
summary{cursor:pointer;padding:13px 16px;font-weight:700;list-style:none;display:flex;justify-content:space-between}
summary::after{content:"▾";color:var(--muted)}details[open] summary::after{content:"▴"}
summary::-webkit-details-marker{display:none}
details .in{padding:0 16px 14px;display:grid;gap:8px;font-size:.92rem}
.muted{color:var(--muted)}.small{font-size:.84rem}
.btn{display:inline-flex;justify-content:center;align-items:center;min-height:44px;padding:10px 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--fg);font:700 .92rem var(--display);cursor:pointer;text-decoration:none}
.intro{background:var(--soft);border-radius:14px;padding:14px 16px;display:grid;gap:8px;font-size:.93rem}
.foot{text-align:center;font-size:.8rem;color:var(--muted)}
code{font:500 .78rem var(--mono);overflow-wrap:anywhere}

/* ---- Direction artistique D : lime dominant, nuit, Unbounded + Manrope ---- */
h1,h2,h3{font-family:var(--head);letter-spacing:-.03em}
.wm{font:800 1.12rem var(--head);letter-spacing:-.045em;color:var(--fg)}
.brand{gap:9px}
body{font-variant-numeric:tabular-nums}
.btn{border-radius:999px}
.card{border-radius:22px}
.big b{font-family:var(--head);letter-spacing:-.05em;color:var(--orange)}
.leg .r{color:var(--orange)}.leg .r.okc{color:var(--lime)}
.total span:last-child{color:var(--orange)!important}
.check i{color:var(--lime)}.check i.w,.check i.x{color:var(--orange)}
.banner h1{font-family:var(--head);letter-spacing:-.03em}

/* ---- Revision E : calme et relief. Gros titres gras et aplats lime seulement par touches. ---- */
h1,h2,h3{font-family:var(--head);font-weight:700;letter-spacing:-.015em}
.wm{font:700 1.15rem var(--head);letter-spacing:-.02em;color:var(--fg)}
.d-ok{background:rgb(212 255 58/.12);color:var(--lime)}.d-mid,.d-bad{background:rgb(255 138 92/.14);color:var(--orange)}
.top{background:transparent;border-bottom:0}
.banner{padding:6px 16px 0;background:transparent!important}
.banner .in{background:#FFFFFF;border-radius:22px;padding:16px 18px;box-shadow:0 1px 2px rgb(18 20 23/.06),0 8px 24px rgb(18 20 23/.06)}
.banner h1{font-size:1.3rem;font-weight:700;letter-spacing:-.01em;color:#121417}
.banner p{color:#5C6068;opacity:1}
.banner.bad .in{box-shadow:inset 0 0 0 2px #C2410C,0 8px 24px rgb(18 20 23/.06)}
.card,details{background:#FFFFFF;border:0;border-radius:22px;box-shadow:0 1px 2px rgb(18 20 23/.06),0 8px 24px rgb(18 20 23/.06)}
.intro{background:#FFFFFF;border-radius:22px;box-shadow:0 1px 2px rgb(18 20 23/.06)}
.big b{font-family:var(--head);font-weight:700;letter-spacing:-.03em;color:#C2410C}
.leg .r{color:#C2410C}.leg .r.okc{color:#3E6B00}
.total{border-top-color:#121417}.total span:last-child{color:#C2410C!important}
.check i{color:#3E6B00}.check i.w,.check i.x{color:#C2410C}
.btn{background:#FFFFFF;border:0;box-shadow:inset 0 0 0 1.5px #D6D5CF;border-radius:999px}
a{color:#121417}

/* ---- Ordinateur : page plus large, retard et détail côte à côte ---- */
@media (min-width:1024px){
  .banner .in, main{max-width:1000px}
  .top{padding-left:max(16px,calc((100vw - 1000px) / 2));padding-right:max(16px,calc((100vw - 1000px) / 2))}
  main{grid-template-columns:repeat(2,minmax(0,1fr));align-items:start}
  main > .intro, main > details, main > .foot, main > section:nth-of-type(3){grid-column:1 / -1}
  main > section:only-of-type{grid-column:1 / -1}
}
</style>
</head>
<body>
<header class="top"><a class="brand" href="./"><svg width="24" height="24" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="18" fill="#D4FF3A"/><circle cx="32" cy="32" r="19" fill="none" stroke="#0B0C0F" stroke-opacity=".18" stroke-width="5"/><circle cx="32" cy="32" r="19" fill="none" stroke="#0B0C0F" stroke-width="5" stroke-linecap="round" pathLength="360" stroke-dasharray="120 360" transform="rotate(-90 32 32)"/><path d="M32 32L41.5 37.5" stroke="#0B0C0F" stroke-width="5" stroke-linecap="round"/><circle cx="32" cy="32" r="4" fill="#0B0C0F"/></svg><span class="wm">lateproof</span></a><span class="code" id="code"></span></header>
<section class="banner wait" id="banner" aria-live="polite"><div class="in"><h1 id="bTitle"></h1><p id="bSub"></p></div></section>
<main id="main"></main>

<script src="config.js"></script>
<script src="lp-i18n.js"></script>
<script src="lp-core.js"></script>
<script>
"use strict";
const {fmt, esc} = LP, $ = id => document.getElementById(id);
const {L, locale} = LPI;
document.title = L("Vérification du justificatif · LateProof", "Certificate check · LateProof");
$("bTitle").textContent = L("Vérification…", "Checking…");
$("bSub").textContent = L("Contrôle de la signature et du sceau, directement dans ce navigateur.", "Checking the signature and the seal, right here in your browser.");
const ICON_OK = `<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#D4FF3A"/><path d="M7 12.5l3.2 3.2L17 9" fill="none" stroke="#121417" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const ICON_BAD = `<svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="#C2410C"/><path d="M8 8l8 8M16 8l-8 8" fill="none" stroke="#FFFFFF" stroke-width="2.4" stroke-linecap="round"/></svg>`;
const LABELS = L({trains: "Trains", arrivee: "Gare d'arrivée", depart: "Gare de départ", etapes: "Détail par étape", checkin: "Heure du check-in", presence: "Présence",
  titulaire: "Titulaire", releves: "Relevés officiels du retard", date: "Date", retard_min: "Retard", arrivee_prevue: "Arrivée prévue", arrivee_reelle: "Arrivée réelle", declare: "Heure prévue"},
  {trains: "Trains", arrivee: "Arrival station", depart: "Departure station", etapes: "Leg by leg", checkin: "Check-in time", presence: "Presence",
  titulaire: "Holder", releves: "Official delay records", date: "Date", retard_min: "Delay", arrivee_prevue: "Scheduled arrival", arrivee_reelle: "Actual arrival", declare: "Scheduled time"});

function banner(kind, title, sub) {
  const b = $("banner"); b.className = "banner " + kind;
  $("bTitle").innerHTML = (kind === "ok" ? ICON_OK : kind === "bad" ? ICON_BAD : "") + `<span>${esc(title)}</span>`;
  $("bSub").textContent = sub;
}

async function main() {
  const h = new URLSearchParams(location.hash.slice(1)).get("c");
  if (!h) { banner("wait", L("Aucun justificatif", "No certificate"), L("Ouvre le lien complet reçu par message.", "Open the full link you received.")); $("main").innerHTML = `<div class="card">${L("Ce lien est incomplet. Demande à la personne de te renvoyer le lien de son justificatif LateProof.", "This link is incomplete. Ask the person to send you the link to their LateProof certificate again.")}</div>`; return; }
  let c;
  try { c = LP.certFromHash(h); } catch (e) { banner("bad", L("Lien illisible", "Unreadable link"), L("Le justificatif a été abîmé ou modifié.", "The certificate was damaged or altered.")); return; }
  const chk = await LP.checkCert(c).catch(() => ({ok: false, signature: {ok: false}}));
  const code = LP.shortCode(chk.root || c.root || "00".repeat(32)); $("code").textContent = "code " + code;
  const F = Object.fromEntries(c.f.filter(f => !f.h).map(f => [f.n, f.v]));
  const hidden = c.f.filter(f => f.h).map(f => LABELS[f.n] || f.n);
  const delay = +F.retard_min || 0;
  if (!chk.ok) {
    banner("bad", L("Justificatif modifié", "Certificate altered"), L("Ce document ne correspond pas à celui qui a été signé. Ne vous y fiez pas.", "This document does not match the one that was signed. Do not rely on it."));
    $("main").innerHTML = `<div class="card"><b>${L("Ce qui ne va pas", "What is wrong")}</b>${F.retard_min ? `<span>${L("Retard affiché", "Delay shown")} : <b>+${esc(F.retard_min)} min</b>${L(", mais ce chiffre n'est pas celui qui a été signé.", ", but this is not the figure that was signed.")}</span>` : ""}<span>${chk.signature && chk.signature.ok === false ? L("Le contenu affiché ne correspond pas à la signature du titulaire : au moins une information a été changée après coup.", "The content shown does not match the holder's signature: at least one item was changed afterwards.") : L("La signature est illisible.", "The signature is unreadable.")}</span></div>
      <div class="card small">${L("Un justificatif LateProof ne peut pas être modifié sans que cela se voie. Demandez le lien d'origine à son titulaire.", "A LateProof certificate cannot be changed without it showing. Ask its holder for the original link.")}</div>
      <p class="foot">${L("Vérification faite dans votre navigateur, sans passer par nos serveurs.", "Checked in your browser, without going through our servers.")}</p>`;
    return;
  }
  banner("ok", L("Justificatif authentique", "Authentic certificate"), L("Vérifié à l'instant, dans votre navigateur.", "Checked just now, in your browser."));
  const day = F.date ? new Date(F.date + "T12:00:00Z").toLocaleDateString(locale, {weekday: "long", day: "numeric", month: "long", year: "numeric"}) : "";
  let legs = []; try { legs = JSON.parse(F.etapes || "[]"); } catch (e) {}
  const sig = chk.signature, browserKey = sig.kind === "browser";
  $("main").innerHTML = `
    ${seenIntro() ? "" : `<div class="intro" id="intro"><b>${L("En 15 secondes", "In 15 seconds")}</b><span>${L("Cette page vérifie un justificatif de retard de train. Le retard vient des données officielles SNCF et Île-de-France Mobilités. Le justificatif a été signé par le téléphone de son titulaire au moment des faits : s'il avait été modifié, cette page s'afficherait en orange.", "This page checks a train delay certificate. The delay comes from official SNCF and Île-de-France Mobilités data. The certificate was signed by its holder's phone at the time: had it been altered, this page would turn orange.")}</span><button class="btn" id="gotit">${L("Compris", "Got it")}</button></div>`}
    <section class="card"><span class="kicker">${esc(day)}${legs.length > 1 ? L(` · trajet en ${legs.length} étapes`, ` · ${legs.length}-leg trip`) : ""}</span>
      <div class="big"><b>+${delay}</b><span><b style="font:inherit;color:inherit">min</b> ${L("de retard", "late")}${legs.length > 1 ? L(" au total", " in total") : ""}</span></div>
      ${F.arrivee_prevue && F.arrivee_reelle ? `<span>${L("Arrivée prévue", "Scheduled arrival")} <b>${fmt.time(+F.arrivee_prevue)}</b>${F.arrivee ? ` ${L("à", "at")} ${esc(F.arrivee)}` : ""}, ${L("arrivée réelle", "actual arrival")} <b>${fmt.time(+F.arrivee_reelle)}</b>.</span>` : ""}
      ${F.declare && F.declare !== "non" ? `<span class="small muted">${L("Heure d'arrivée prévue déclarée par le titulaire (correspondance manquée) ; les retards de chaque train sont relevés.", "Scheduled arrival time declared by the holder (missed connection); each train's delay is recorded.")}</span>` : ""}
    </section>
    ${legs.length ? `<section class="card"><span class="kicker">${L("Le détail", "Details")}</span>${legs.map(l => `<div class="leg"><span class="t">${esc(l.t)}</span>
      <span class="r ${l.x ? "" : fmt.min(l.r) < 1 ? "okc" : ""}">${l.x ? L("supprimé", "cancelled") : fmt.min(l.r) < 1 ? L("à l'heure", "on time") : "+" + fmt.min(l.r) + " min"}</span>
      <span class="s">${l.a ? `${L("jusqu'à", "to")} ${esc(l.a)} · ` : ""}${L("prévu", "scheduled")} ${fmt.time(l.ap)}</span></div>`).join("")}
      <div class="total"><span>${L("Retard à l'arrivée", "Arrival delay")}</span><span style="font-family:var(--mono);color:var(--bad)">+${delay} min</span></div></section>`
      : F.trains ? `<section class="card"><span class="kicker">Trains</span><span>${esc(F.trains)}</span></section>` : ""}
    <section class="card">
      <div class="check"><i aria-hidden="true">✓</i><span>${F.presence ? `<b>${esc(F.presence.split(" : ")[0])}</b> : ${esc(F.presence.split(" : ").slice(1).join(" : "))}` : L("Présence non communiquée", "Presence not shared")}${F.checkin ? ` (${L("check-in à", "check-in at")} ${fmt.time(+F.checkin)})` : ""}.</span></div>
      <div class="check"><i aria-hidden="true" class="${browserKey ? "w" : ""}">${browserKey ? "!" : "✓"}</i><span>${browserKey ? L("Signé par <b>la clé du navigateur</b> de son titulaire (sans déverrouillage par visage ou empreinte).", "Signed by <b>its holder's browser key</b> (no face or fingerprint unlock).") : `${L("Signé par <b>le téléphone de son titulaire</b>", "Signed by <b>its holder's phone</b>")}${sig.userVerified ? L(", déverrouillé par visage, empreinte ou code", ", unlocked by face, fingerprint or PIN") : ""}.`}${F.titulaire ? ` ${L("Titulaire", "Holder")} : <b>${esc(F.titulaire)}</b>.` : ""}</span></div>
      <div class="check"><i aria-hidden="true">✓</i><span>${L("Scellé le", "Sealed on")} ${new Date(c.at * 1000).toLocaleString(locale, {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris"})} : ${L("<b>impossible à modifier</b> sans que cette page passe à l'orange.", "<b>cannot be changed</b> without this page turning orange.")}</span></div>
      <div class="check" id="cross"><i aria-hidden="true" class="w">…</i><span>${L("Comparaison avec les relevés officiels…", "Comparing with the official records…")}</span></div>
      <div class="check" id="chain"><i aria-hidden="true" class="w">…</i><span>${L("Vérification du sceau sur Solana…", "Checking the seal on Solana…")}</span></div>
      ${hidden.length ? `<div class="check"><i aria-hidden="true" class="w">◦</i><span class="muted">${L("Non montré par le titulaire, mais scellé", "Not shown by the holder, but sealed")} : ${esc(hidden.join(", "))}.</span></div>` : ""}
    </section>
    <details><summary>${L("Pourquoi c'est fiable ?", "Why can I trust it?")}</summary><div class="in">${L(`
      <div><b>1. Les retards viennent des données officielles</b> de la SNCF et d'Île-de-France Mobilités, relevées en direct toutes les 2 minutes.</div>
      <div><b>2. Le justificatif est signé par le téléphone</b> de son titulaire, au moment des faits. Un autre appareil ne peut pas le produire, et la moindre modification se voit.</div>
      <div><b>3. Les relevés de chaque jour sont scellés chaque nuit</b> dans un registre public (Solana), que personne ne peut modifier, pas même LateProof.</div>`, `
      <div><b>1. Delays come from official data</b> from SNCF and Île-de-France Mobilités, recorded live every 2 minutes.</div>
      <div><b>2. The certificate is signed by the holder's phone</b>, at the time. No other device can produce it, and the smallest change shows.</div>
      <div><b>3. Each day's records are sealed every night</b> in a public ledger (Solana) that nobody can change, not even LateProof.</div>`)}
    </div></details>
    <details><summary>${L("Ce que ça prouve, et ce que ça ne prouve pas", "What it proves, and what it does not")}</summary><div class="in">
      <div>${L("Prouve : le retard de chaque train (données officielles), la déclaration de présence du titulaire dans le train, faite sur le moment, et que rien n'a été changé depuis.", "Proves: each train's delay (official data), the holder's statement of being on the train, made at the time, and that nothing has changed since.")}</div>
      <div class="muted">${L("Ne prouve pas : la raison de son heure de départ. C'est un élément de preuve, pas un document officiel de l'opérateur.", "Does not prove: why they left at that time. It is a piece of evidence, not an official document from the operator.")}</div>
    </div></details>
    <details><summary>${L("Détails techniques", "Technical details")}</summary><div class="in small">
      <div>${L("Empreinte du justificatif (racine Merkle des champs)", "Certificate fingerprint (Merkle root of the fields)")} : <code>${esc(chk.root)}</code></div>
      <div>Signature : ECDSA P-256 (${browserKey ? L("clé du navigateur", "browser key") : "passkey WebAuthn"}), ${L("créée sur", "created on")} <code>${esc(sig.origin || "")}</code>.</div>
      <div id="anchor">${L(`Ancrage public : les relevés du ${esc(F.date || "")} sont scellés chaque nuit ; empreinte publiée sur Solana (devnet)`, `Public anchor: the records of ${esc(F.date || "")} are sealed every night; fingerprint published on Solana (devnet)`)} : <a href="https://explorer.solana.com/address/8RKxwUR3X1vUG2HD2ruHYaPFa9ahExbMsCzg1L44aJeu?cluster=devnet" target="_blank" rel="noopener">${L("voir le programme", "see the program")}</a>.</div>
    </div></details>
    <p class="foot">${L("Vérification faite dans votre navigateur, sans compte et sans passer par nos serveurs.<br>Seul ce site fait foi. Code du justificatif", "Checked in your browser, with no account and without going through our servers.<br>Only this site is authoritative. Certificate code")} : <b>${esc(code)}</b></p>`;
  const g = $("gotit"); if (g) g.onclick = () => { LP.store.set("lpv-intro", true); $("intro").remove(); };
  crossCheck(F).catch(() => setCross("w", L("Comparaison avec les relevés indisponible pour le moment.", "Comparison with the records is unavailable right now.")));
  sealCheck(F).catch(() => setChain("w", L("Vérification sur Solana indisponible pour le moment.", "Solana check unavailable right now.")));
}
const seenIntro = () => LP.store.get("lpv-intro");
function setCross(k, html) { const el = $("cross"); if (el) el.innerHTML = `<i aria-hidden="true" class="${k}">${k === "x" ? "✕" : k === "w" ? "!" : "✓"}</i><span>${html}</span>`; }

// Les releves du justificatif sont-ils identiques a ceux de notre base ? (gardes en detail 2 jours ; ensuite : preuve Solana)
async function crossCheck(F) {
  let recs = []; try { recs = JSON.parse(F.releves || "[]"); } catch (e) {}
  if (!F.releves) return setCross("w", L("Relevés officiels non montrés par le titulaire.", "Official records not shown by the holder."));
  if (!recs.length) return setCross("w", L("Aucun retard d'au moins une minute relevé sur les trains de ce trajet.", "No delay of one minute or more was recorded on the trains of this trip."));
  let same = 0, seen = 0, diff = [];
  for (const r of recs) {
    const [, net, day, num, stop] = r.split("|");
    const t = await LP.rpc("public_journey_train", {p_net: net, p_num: num, p_day: day}).catch(() => null);
    if (!t) continue; seen++;
    const st = (t.stops || []).find(s => s.stop === stop);
    if (st && st.rec === r) same++; else diff.push(num);
  }
  if (!seen) return setCross("w", L("Relevés de ce jour plus en détail dans notre base : ils sont scellés dans l'empreinte de la nuit (publiée chaque nuit sur Solana).", "This day's detailed records are no longer in our database: they are sealed in that night's fingerprint (published every night on Solana)."));
  if (diff.length) return setCross("x", L(`Écart avec nos relevés pour le train ${esc(diff.join(", "))} : le retard a pu évoluer après la signature.`, `Differs from our records for train ${esc(diff.join(", "))}: the delay may have changed after signing.`));
  setCross("", L(`<b>Identique aux relevés officiels</b> enregistrés par LateProof (${same} relevé${same > 1 ? "s" : ""}).`, `<b>Matches the official records</b> kept by LateProof (${same} record${same > 1 ? "s" : ""}).`));
}
// ------------------------------------------------------------------ Sceau Solana, vérifié ici même, sans nous faire confiance :
// 1. on lit l'empreinte de la journée directement sur Solana (compte du programme LateProof, réseau devnet) ;
// 2. on télécharge la liste publique EXACTE des relevés de ce jour-là et on recalcule l'empreinte dans le navigateur
//    (mêmes règles que le programme : feuille = SHA-256(0x00 « DLY » relevé), nœud = SHA-256(0x01 min max)) ;
// 3. on vérifie que les relevés de ce justificatif font partie de la liste.
const SOL_RPC = "https://api.devnet.solana.com", PROGRAM = "8RKxwUR3X1vUG2HD2ruHYaPFa9ahExbMsCzg1L44aJeu";
const hexOf = b => Array.from(b, x => x.toString(16).padStart(2, "0")).join("");
const explorer = (kind, id) => `https://explorer.solana.com/${kind}/${id}?cluster=devnet`;
function setChain(k, html) { const el = $("chain"); if (el) el.innerHTML = `<i aria-hidden="true" class="${k}">${k === "x" ? "✕" : k === "w" ? "!" : "✓"}</i><span>${html}</span>`; }
async function sha(bytes) { return new Uint8Array(await crypto.subtle.digest("SHA-256", bytes)); }
function lessEq(a, b) { for (let i = 0; i < 32; i++) { if (a[i] !== b[i]) return a[i] < b[i]; } return true; }
async function merkleRoot(lines, progress) {
  const enc = new TextEncoder();
  let level = [];
  for (let i = 0; i < lines.length; i += 4000) {   // par paquets : la page reste fluide
    level.push(...await Promise.all(lines.slice(i, i + 4000).map(l => { const b = enc.encode(l), m = new Uint8Array(4 + b.length); m.set([0, 68, 76, 89]); m.set(b, 4); return sha(m); })));
    progress(i / lines.length / 2);
  }
  while (level.length > 1) {
    const nxt = [];
    for (let i = 0; i < level.length; i += 2) {
      if (i + 1 >= level.length) { nxt.push(Promise.resolve(level[i])); continue; }
      const [lo, hi] = lessEq(level[i], level[i + 1]) ? [level[i], level[i + 1]] : [level[i + 1], level[i]];
      const m = new Uint8Array(65); m[0] = 1; m.set(lo, 1); m.set(hi, 33); nxt.push(sha(m));
    }
    level = await Promise.all(nxt);
  }
  return hexOf(level[0]);
}
async function sealCheck(F) {
  let recs = []; try { recs = JSON.parse(F.releves || "[]"); } catch (e) {}
  const day = recs.length ? recs[0].split("|")[2] : String(F.date || "").replace(/-/g, "");
  if (!/^\d{8}$/.test(day)) return setChain("w", L("Aucun relevé à rapprocher de l'empreinte publiée sur Solana.", "No record to match with the fingerprint published on Solana."));
  const dayTxt = new Date(`${day.slice(0, 4)}-${day.slice(4, 6)}-${day.slice(6)}T12:00:00`).toLocaleDateString(locale, {day: "numeric", month: "long"});
  const d = await LP.rpc("public_delay_root", {p_day: day}).catch(() => null);
  if (!d || !d.tx) return setChain("w", L(`Les relevés du ${dayTxt} seront scellés sur Solana dans la nuit qui suit ; revenez sur cette page demain pour la preuve complète.`,
    `The records of ${dayTxt} are sealed on Solana the following night; come back tomorrow for the full proof.`));
  const txLink = `<a href="${explorer("tx", esc(d.tx))}" target="_blank" rel="noopener">${L("voir la transaction", "see the transaction")} ↗</a>`;
  const anchor = $("anchor");
  if (anchor) anchor.innerHTML = `${L("Ancrage public", "Public anchor")} : ${L("empreinte des relevés du", "fingerprint of the records of")} ${dayTxt} <code>${esc(d.root)}</code> (${new Intl.NumberFormat(locale).format(d.n)} ${L("relevés", "records")}), ` +
    `${L("publiée sur Solana (devnet)", "published on Solana (devnet)")} : ${txLink}${d.pda ? ` · <a href="${explorer("address", esc(d.pda))}" target="_blank" rel="noopener">${L("compte de l'empreinte", "fingerprint account")} ↗</a>` : ""} · <a href="${explorer("address", PROGRAM)}" target="_blank" rel="noopener">${L("programme", "program")} ↗</a>.`;
  // 1. L'empreinte telle qu'elle est écrite sur Solana
  let onChain = null;
  if (d.pda) {
    const r = await fetch(SOL_RPC, {method: "POST", headers: {"Content-Type": "application/json"},
      body: JSON.stringify({jsonrpc: "2.0", id: 1, method: "getAccountInfo", params: [d.pda, {encoding: "base64", commitment: "finalized"}]})}).then(x => x.json()).catch(() => null);
    const b64 = r && r.result && r.result.value && r.result.value.data && r.result.value.data[0];
    // Compte Anchor : 8 octets d'en-tête, jour (4), racine (32), nombre (4), date (8)
    if (b64) { const raw = Uint8Array.from(atob(b64), c => c.charCodeAt(0)); onChain = hexOf(raw.slice(12, 44)); }
  }
  if (onChain && onChain !== d.root) return setChain("x", L(`<b>Écart avec Solana</b> : l'empreinte du ${dayTxt} lue sur la blockchain ne correspond pas. ${txLink}`, `<b>Mismatch with Solana</b>: the fingerprint of ${dayTxt} read on the blockchain does not match. ${txLink}`));
  if (!d.list || !recs.length || !("DecompressionStream" in window)) return setChain(onChain ? "" : "w", L(`Les relevés du ${dayTxt} sont scellés sur Solana. ${txLink}`, `The records of ${dayTxt} are sealed on Solana. ${txLink}`));
  // 2. La liste publique exacte, recalculée ici
  const nf = new Intl.NumberFormat(locale);
  setChain("w", L(`Recalcul de l'empreinte du ${dayTxt} à partir de ses ${nf.format(d.n)} relevés publics…`, `Recomputing the fingerprint of ${dayTxt} from its ${nf.format(d.n)} public records…`));
  const res = await fetch(`${LP.CFG.url}/storage/v1/object/public/${d.list}`);
  if (!res.ok) return setChain(onChain ? "" : "w", L(`Les relevés du ${dayTxt} sont scellés sur Solana. ${txLink}`, `The records of ${dayTxt} are sealed on Solana. ${txLink}`));
  const text = await new Response(res.body.pipeThrough(new DecompressionStream("gzip"))).text();
  const lines = text.split("\n").filter(Boolean), set = new Set(lines);
  const missing = recs.filter(r => !set.has(r));
  if (missing.length) return setChain("x", L(`<b>Absent de l'empreinte du ${dayTxt}</b> : ${missing.length} relevé${missing.length > 1 ? "s" : ""} de ce justificatif ne figure${missing.length > 1 ? "nt" : ""} pas dans les relevés scellés sur Solana. ${txLink}`,
    `<b>Not in the ${dayTxt} fingerprint</b>: ${missing.length} record${missing.length > 1 ? "s" : ""} of this certificate ${missing.length > 1 ? "are" : "is"} not in the records sealed on Solana. ${txLink}`));
  const t0 = performance.now();
  const root = await merkleRoot(lines, f => setChain("w", L(`Recalcul de l'empreinte du ${dayTxt}… ${Math.round(f * 100)} %`, `Recomputing the fingerprint of ${dayTxt}… ${Math.round(f * 100)} %`)));
  const target = onChain || d.root;
  if (root !== target) return setChain("x", L(`<b>Empreinte différente</b> : la liste publique du ${dayTxt} ne redonne pas l'empreinte scellée sur Solana. ${txLink}`, `<b>Fingerprint differs</b>: the public list of ${dayTxt} does not give back the fingerprint sealed on Solana. ${txLink}`));
  const posted = d.posted_at ? new Date(d.posted_at * 1000).toLocaleString(locale, {day: "numeric", month: "short", hour: "2-digit", minute: "2-digit", timeZone: "Europe/Paris"}) : "";
  setChain("", L(`<b>Scellé sur Solana</b> : ce retard fait partie des ${nf.format(lines.length)} relevés du ${dayTxt}, dont l'empreinte est inscrite sur la blockchain${posted ? ` depuis le ${posted}` : ""}${onChain ? "" : " (lecture directe de la blockchain indisponible : empreinte de notre registre)"}. Empreinte recalculée dans votre navigateur en ${(Math.max(.1, (performance.now() - t0) / 1000)).toFixed(1)} s : identique. ${txLink}`,
    `<b>Sealed on Solana</b>: this delay is one of the ${nf.format(lines.length)} records of ${dayTxt}, whose fingerprint is written on the blockchain${posted ? ` since ${posted}` : ""}${onChain ? "" : " (direct blockchain read unavailable: fingerprint from our registry)"}. Fingerprint recomputed in your browser in ${(Math.max(.1, (performance.now() - t0) / 1000)).toFixed(1)} s: identical. ${txLink}`));
}

main();
